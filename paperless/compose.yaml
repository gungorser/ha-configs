# Paperless-ngx (documents), Postgres, Redis and paperless-gpt (AI tags/OCR, profile "gpt", enabled
# in .env once its config and Gemini key were in place). On the shared `proxy` network: NPM forwards
# paperless.gungors.duckdns.org to paperless:8000; no published ports. Data in /srv/data/paperless,
# documents on the nas-dokuman disk (/srv/nas/dokuman/paperless). Secrets: /opt/secrets/paperless.env
# (hook.sh). The Pi add-on's 2.20.15 data was imported, then upgraded to 3.x (v3 migration guide:
# explicit DB engine, consumer/OCR settings renamed, duplicates and archive behaviour kept as in 2.x).
name: paperless

services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2
    restart: unless-stopped
    depends_on: [db, broker]
    env_file: /opt/secrets/paperless.env   # secret key, DB password, admin, OIDC provider JSON
    environment:
      USERMAP_UID: "8003"
      USERMAP_GID: "8003"
      PAPERLESS_URL: https://paperless.gungors.duckdns.org
      PAPERLESS_TIME_ZONE: Europe/Amsterdam
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: db
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_OCR_LANGUAGES: nld tur
      PAPERLESS_OCR_LANGUAGE: nld+eng+tur
      PAPERLESS_FILENAME_FORMAT: "{{ created_year }}/{{ correspondent }}/{{ title }}"
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "false"
      PAPERLESS_CONSUMER_POLLING_INTERVAL: "60"
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"   # v2 behaviour: reject duplicates
      PAPERLESS_ARCHIVE_FILE_GENERATION: always       # v2 default: always keep an archive PDF
      # NPM on the proxy network is the only proxy in front: real client IPs for login rate limits.
      PAPERLESS_TRUSTED_PROXIES: 172.19.0.0/16
      PAPERLESS_ALLAUTH_TRUSTED_PROXY_COUNT: "1"
      # Login: Authelia (OIDC) for people, the local admin as break-glass. Phone apps' password
      # login (/api/token/, Basic auth) is checked against Authelia by authelia_auth (mounted below),
      # so the LLDAP password works there too; only users made by an OIDC login are accepted.
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect,authelia_auth.apps.AutheliaAuthConfig
      PYTHONPATH: /usr/src/paperless/ext   # outside src/: the image compiles src/ at start
      # People come from LLDAP through Authelia: username = preferred_username, LLDAP groups
      # admin/aile join the Paperless groups of the same name (created by hook.sh).
      PAPERLESS_SOCIALACCOUNT_ALLOW_SIGNUPS: "true"
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
      PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
      PAPERLESS_ACCOUNT_ALLOW_SIGNUPS: "false"
      PAPERLESS_DISABLE_REGULAR_LOGIN: "false"   # break-glass: the imported local admin
      # The login page goes straight to Authelia; the local form stays reachable for the break-glass
      # admin at /accounts/login/?loggedout=1.
      PAPERLESS_REDIRECT_LOGIN_TO_SSO: "true"
    extra_hosts:
      # OIDC calls to Authelia go straight to NPM on this VM, not through the router.
      - auth.gungors.duckdns.org:192.168.0.222
    volumes:
      - /srv/data/paperless/data:/usr/src/paperless/data
      - /srv/nas/dokuman/paperless/media:/usr/src/paperless/media
      - /srv/nas/dokuman/paperless/consume:/usr/src/paperless/consume
      - /srv/nas/dokuman/paperless/export:/usr/src/paperless/export
      - ./authelia_auth:/usr/src/paperless/ext/authelia_auth:ro
    networks: [proxy, default]

  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    env_file: /opt/secrets/paperless.env   # POSTGRES_PASSWORD
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
    volumes:
      - /srv/data/paperless/pgdata:/var/lib/postgresql/data

  broker:
    image: redis:8.6.8-alpine
    restart: unless-stopped
    volumes:
      - /srv/data/paperless/redis:/data

  paperless-gpt:
    image: icereed/paperless-gpt:v0.31.0
    profiles: [gpt]
    restart: unless-stopped
    depends_on: [paperless]
    env_file: /opt/secrets/paperless-gpt.env   # PAPERLESS_API_TOKEN (user paperless-gpt, group aile), GOOGLEAI_API_KEY
    environment:
      PAPERLESS_BASE_URL: http://paperless:8000
      PAPERLESS_PUBLIC_URL: https://paperless.gungors.duckdns.org
      LLM_PROVIDER: googleai
      LLM_MODEL: gemini-3.5-flash-lite
      VISION_LLM_PROVIDER: googleai
      VISION_LLM_MODEL: gemini-3.5-flash-lite
      OCR_PROVIDER: llm
      # As on the Pi add-on (Sercan's settings):
      LLM_LANGUAGE: dutch, turkish or english
      CREATE_NEW_TAGS: "false"
      AUTO_GENERATE_DOCUMENT_TYPE: "false"
      LOG_LEVEL: info
      IMAGE_MAX_RENDER_DPI: "200"          # keeps vision OCR inside memory (OOM fix)
      IMAGE_MAX_PIXEL_DIMENSION: "2400"
      IMAGE_MAX_TOTAL_PIXELS: "4000000"
    volumes:
      - /srv/data/paperless/gpt/prompts:/app/prompts   # Sercan's prompts, copied from the Pi add-on
      - /srv/data/paperless/gpt/db:/app/db              # workflows and history
      - /srv/data/paperless/gpt/config:/app/config      # settings made in its UI
    networks: [proxy, default]

networks:
  proxy:
    external: true
