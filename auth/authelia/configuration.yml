# Authelia: login portal at https://auth.gungors.duckdns.org, users from LLDAP, forward-auth for
# the NPM hosts with auth = "authelia" (proxy/hosts.toml). Secrets come from files (*_FILE in
# compose.yaml). Mounted read-only; the database and notifications live in /data.
theme: auto

server:
  address: tcp://:9091/

log:
  level: info

totp:
  issuer: gungors.duckdns.org

authentication_backend:
  # Off: a password changed through Authelia would reach LLDAP but not the NAS (Samba).
  # Passwords are changed with set-password on the docker VM (nas area).
  password_reset:
    disable: true
  ldap:
    implementation: lldap
    address: ldap://lldap:3890
    base_dn: dc=gungors,dc=duckdns,dc=org
    # Service user created by hook.sh (group lldap_password_manager, so password reset works).
    user: uid=authelia,ou=people,dc=gungors,dc=duckdns,dc=org

access_control:
  default_policy: deny
  rules:
    - domain: auth.gungors.duckdns.org
      policy: bypass
    # Admin tools: admin group. Password only: 2FA is off by Sercan's decision (2026-11-12);
    # set these two rules back to two_factor to turn it on (the TOTP section stays configured).
    - domain:
        - paperless-gpt.gungors.duckdns.org
      subject: ["group:admin"]
      policy: one_factor
    - domain: home.gungors.duckdns.org
      subject: ["group:admin"]
      policy: one_factor
    - domain: home.gungors.duckdns.org
      subject: ["group:aile"]
      policy: one_factor

session:
  cookies:
    - domain: gungors.duckdns.org
      authelia_url: https://auth.gungors.duckdns.org

regulation:
  max_retries: 5
  find_time: 10m
  ban_time: 15m

storage:
  local:
    path: /data/db.sqlite3

# No SMTP yet: reset links and 2FA registration codes are written to this file
# (sudo tail /srv/data/auth/authelia/notification.txt on the docker VM).
notifier:
  filesystem:
    filename: /data/notification.txt

# OIDC provider. The HMAC secret comes from AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE, the
# signing key through the template filter (X_AUTHELIA_CONFIG_FILTERS=template in compose.yaml);
# both are generated by hook.sh. Clients use PKCE; a public client keeps no secret anywhere.
# immich_role for Immich: LLDAP group admin -> Immich admin, everyone else a normal user.
definitions:
  user_attributes:
    immich_role:
      expression: '"admin" in groups ? "admin" : "user"'

identity_providers:
  oidc:
    # Only the family (LLDAP group aile) may log in to clients with this policy (misafir is denied).
    authorization_policies:
      admin:
        default_policy: deny
        rules:
          - policy: one_factor
            subject: group:admin
      aile:
        default_policy: deny
        rules:
          - policy: one_factor
            subject: group:aile
    # Scope `immich` hands Immich the immich_role claim (oauth.roleClaim in immich/immich.json).
    claims_policies:
      immich:
        custom_claims:
          immich_role:
            attribute: immich_role
    scopes:
      immich:
        claims: [immich_role]
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/oidc_jwks_rs256.pem" | mindent 10 "|" | msquote }}
    clients:
      # Home Assistant via hass-oidc-auth (HACS). Groups map to HA roles there: admin -> admin,
      # aile -> user. Password only while 2FA is off (authorization_policy one_factor).
      - client_id: homeassistant
        client_name: Home Assistant
        public: true
        require_pkce: true
        pkce_challenge_method: S256
        authorization_policy: one_factor
        consent_mode: implicit
        scopes: [openid, profile, groups]
        redirect_uris:
          - https://ha.gungors.duckdns.org/auth/oidc/callback
      # Home Assistant via hass-openid (HACS cavefire/hass-openid, domain openid; UI config flow).
      # Confidential: secret made by hook.sh, entered into HA's config flow (never in git). Family only
      # (policy aile); HA roles stay on the HA users it links by username (sercan, melike).
      # Redirect: the web login and the Android app's external-browser login both use it.
      - client_id: homeassistant-openid
        client_name: Home Assistant
        client_secret: {{ secret "/secrets/oidc_homeassistant-openid.digest" | msquote }}
        public: false
        require_pkce: true
        pkce_challenge_method: S256
        token_endpoint_auth_method: client_secret_basic
        authorization_policy: aile
        consent_mode: implicit
        scopes: [openid, profile, email]
        redirect_uris:
          - https://ha.gungors.duckdns.org/auth/openid/callback
      # Paperless-ngx (django-allauth openid_connect, provider id authelia). Confidential: the
      # secret's digest comes from the file hook.sh writes; the plain secret only reaches Paperless.
      - client_id: paperless
        client_name: Paperless
        client_secret: {{ secret "/secrets/oidc_paperless.digest" | msquote }}
        public: false
        require_pkce: true
        pkce_challenge_method: S256
        token_endpoint_auth_method: client_secret_basic
        authorization_policy: one_factor
        consent_mode: implicit
        scopes: [openid, profile, email, groups]
        redirect_uris:
          - https://paperless.gungors.duckdns.org/accounts/oidc/authelia/login/callback/
      # Immich (immich area; web and the phone app). Confidential, PKCE; family only (policy aile).
      # Redirects: web login, web account linking, the app's custom scheme.
      - client_id: immich
        client_name: Immich
        client_secret: {{ secret "/secrets/oidc_immich.digest" | msquote }}
        public: false
        require_pkce: true
        pkce_challenge_method: S256
        token_endpoint_auth_method: client_secret_basic
        authorization_policy: aile
        consent_mode: implicit
        claims_policy: immich
        scopes: [openid, profile, email, immich]
        redirect_uris:
          - https://foto.gungors.duckdns.org/auth/login
          - https://foto.gungors.duckdns.org/user-settings
          - app.immich:///oauth-callback
      # Proxmox VE (OpenID realm `authelia`, proxmox area: pve-realm). Admins only (policy admin).
      # Proxmox sends its page origin as redirect URI, without a path. PKCE is not enforced (the
      # confidential secret protects the code exchange); Proxmox sends it anyway.
      - client_id: proxmox
        client_name: Proxmox
        client_secret: {{ secret "/secrets/oidc_proxmox.digest" | msquote }}
        public: false
        require_pkce: false
        token_endpoint_auth_method: client_secret_basic
        authorization_policy: admin
        consent_mode: implicit
        scopes: [openid, profile, email, groups]
        redirect_uris:
          - https://proxmox.gungors.duckdns.org
          - https://192.168.0.220:8006
