# Authelia: login portal at https://auth.gungors.duckdns.org, users from LLDAP, forward-auth for
# the NPM hosts with auth = "authelia" (proxy/hosts.toml). Secrets come from files (*_FILE in
# compose.yaml). Mounted read-only; the database and notifications live in /data.
theme: auto

server:
  address: tcp://:9091/

log:
  level: info

totp:
  issuer: gungors.duckdns.org

authentication_backend:
  # Off: a password changed through Authelia would reach LLDAP but not the NAS (Samba).
  # Passwords are changed with set-password on the docker VM (nas area).
  password_reset:
    disable: true
  ldap:
    implementation: lldap
    address: ldap://lldap:3890
    base_dn: dc=gungors,dc=duckdns,dc=org
    # Service user created by hook.sh (group lldap_password_manager, so password reset works).
    user: uid=authelia,ou=people,dc=gungors,dc=duckdns,dc=org

access_control:
  default_policy: deny
  rules:
    - domain: auth.gungors.duckdns.org
      policy: bypass
    # Admin tools: admin group. Password only: 2FA is off by Sercan's decision (2026-11-12);
    # set these two rules back to two_factor to turn it on (the TOTP section stays configured).
    - domain:
        - npm.gungors.duckdns.org
        - users.gungors.duckdns.org
        - paperless-gpt.gungors.duckdns.org
      subject: ["group:admin"]
      policy: one_factor
    - domain: home.gungors.duckdns.org
      subject: ["group:admin"]
      policy: one_factor
    - domain: home.gungors.duckdns.org
      subject: ["group:aile"]
      policy: one_factor

session:
  cookies:
    - domain: gungors.duckdns.org
      authelia_url: https://auth.gungors.duckdns.org

regulation:
  max_retries: 5
  find_time: 10m
  ban_time: 15m

storage:
  local:
    path: /data/db.sqlite3

# No SMTP yet: reset links and 2FA registration codes are written to this file
# (sudo tail /srv/data/auth/authelia/notification.txt on the docker VM).
notifier:
  filesystem:
    filename: /data/notification.txt

# OIDC provider. The HMAC secret comes from AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE, the
# signing key through the template filter (X_AUTHELIA_CONFIG_FILTERS=template in compose.yaml);
# both are generated by hook.sh. Clients use PKCE; a public client keeps no secret anywhere.
identity_providers:
  oidc:
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/oidc_jwks_rs256.pem" | mindent 10 "|" | msquote }}
    clients:
      # Home Assistant via hass-oidc-auth (HACS). Groups map to HA roles there: admin -> admin,
      # aile -> user. Password only while 2FA is off (authorization_policy one_factor).
      - client_id: homeassistant
        client_name: Home Assistant
        public: true
        require_pkce: true
        pkce_challenge_method: S256
        authorization_policy: one_factor
        consent_mode: implicit
        scopes: [openid, profile, groups]
        redirect_uris:
          - https://ha.gungors.duckdns.org/auth/oidc/callback
          - https://homeassistant.gungors.duckdns.org/auth/oidc/callback
      # Paperless-ngx (django-allauth openid_connect, provider id authelia). Confidential: the
      # secret's digest comes from the file hook.sh writes; the plain secret only reaches Paperless.
      - client_id: paperless
        client_name: Paperless
        client_secret: {{ secret "/secrets/oidc_paperless.digest" | msquote }}
        public: false
        require_pkce: true
        pkce_challenge_method: S256
        token_endpoint_auth_method: client_secret_basic
        authorization_policy: one_factor
        consent_mode: implicit
        scopes: [openid, profile, email, groups]
        redirect_uris:
          - https://paperless.gungors.duckdns.org/accounts/oidc/authelia/login/callback/
