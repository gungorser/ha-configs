# LLDAP (users and groups, LDAP on :3890 inside Docker) and Authelia (login portal, 2FA,
# forward-auth for NPM, OIDC provider later). Both on the shared `proxy` network so NPM reaches
# them by name; no published ports. Data in /srv/data/auth (nas-data), secrets generated by hook.sh
# into /opt/secrets/auth.env and /opt/secrets/auth/ (never in git).
name: auth

services:
  lldap:
    image: lldap/lldap:v0.6.3-alpine-rootless
    user: "8001:8001"
    restart: unless-stopped
    env_file: /opt/secrets/auth.env   # LLDAP_JWT_SECRET, LLDAP_KEY_SEED, LLDAP_LDAP_USER_PASS
    environment:
      TZ: Europe/Amsterdam
      LLDAP_LDAP_BASE_DN: dc=gungors,dc=duckdns,dc=org
      LLDAP_HTTP_URL: https://users.gungors.duckdns.org
    volumes:
      - /srv/data/auth/lldap:/data
      - /opt/secrets/auth/bootstrap:/bootstrap:ro   # repo user/group lists + service user (hook.sh)
    networks: [proxy]
    healthcheck:
      test: ["CMD", "/app/lldap", "healthcheck", "--config-file", "/data/lldap_config.toml"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  authelia:
    image: authelia/authelia:4.39.28
    user: "8002:8002"
    restart: unless-stopped
    depends_on:
      lldap:
        condition: service_healthy
    environment:
      TZ: Europe/Amsterdam
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /secrets/jwt_secret
      AUTHELIA_SESSION_SECRET_FILE: /secrets/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /secrets/storage_key
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: /secrets/ldap_password
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /secrets/oidc_hmac_secret
      X_AUTHELIA_CONFIG_FILTERS: template
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - /srv/data/auth/authelia:/data
      - /opt/secrets/auth/authelia:/secrets:ro
    networks: [proxy]

networks:
  proxy:
    external: true
