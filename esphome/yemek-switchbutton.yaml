# Yemek wall switch (ESP32, 3 relays + 3 keys). Keys only send events; relays are HA switches
# (A, C: no load, drive their key LEDs; B: the mutfak lamp). Written to /config/esphome by configs_deploy (esphome/README.md).
substitutions:
  # Shown by the "Deployment Version" sensor; bump when the firmware is reinstalled.
  sw_version: "2026.11.2"

esphome:
  name: "yemek-switchbutton"

esp32:
  board: esp32dev
  framework:
    type: arduino

ota:
  - platform: esphome
    password: !secret ota_password

# Boots into safe mode (OTA only) after repeated failed boots, so a bad install can be fixed over the air.
safe_mode:

# Enable logging
logger:

# Enable Home Assistant API
api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "yemek-switchbutton"
    password: "yemek-switchbutton"

captive_portal:

# Diagnostic output sensors
text_sensor:
  - platform: template
    name: "Deployment Version"
    lambda: return {"${sw_version}"};
    icon: "mdi:tag"
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      id: ip_address
      name: "IP Address"
      icon: "mdi:wan"

sensor:
  - platform: template
    id: internal_temp
    name: "Internal Temperature"
    icon: "mdi:thermometer"
    unit_of_measurement: "°C"
    entity_category: diagnostic
    disabled_by_default: true
    lambda: return temperatureRead();

  - platform: wifi_signal
    name: "RSSI"
    id: sensor_rssi
    update_interval: 90s
    entity_category: "diagnostic"

  - platform: uptime
    name: "Uptime"
    id: sensor_uptime
    update_interval: 300s
    entity_category: "diagnostic"

# Provide a pre-built button for restarting the device
button:
  - platform: restart
    name: "Restart"
    id: button_restart

  # Reboots into safe mode (OTA only, API off) to test recovery; leaves it after an install or 5 min.
  - platform: safe_mode
    name: "Safe Mode Boot"
    entity_category: "diagnostic"

switch:
  # Physical GPIO Relay
  - platform: gpio
    name: "Relay A"
    pin: GPIO23
    id: relay_a

  # Physical GPIO Relay
  - platform: gpio
    name: "Relay B"
    pin: GPIO19
    id: relay_b

  # Physical GPIO Relay
  - platform: gpio
    name: "Relay C"
    pin: GPIO22
    id: relay_c

output:
  # Physical GPIO PWM for off-state background brightness
  # This pin controls the background brightness for all LEDs
  # physically attached to the relays
  - platform: ledc
    id: pwm_output
    pin: GPIO18
    frequency: 1000 Hz

# Key presses for the gungors pushbutton wrapper (ha-configs gungors/packages/event.yaml):
# event.<device>_action, event types <key>_<single|double|hold>, key 1 = leftmost.
event:
  - platform: template
    name: "Action"
    id: action
    event_types: [1_single, 1_double, 1_hold, 2_single, 2_double, 2_hold, 3_single, 3_double, 3_hold]

binary_sensor:
  # Diagnostic sensor for connection
  - platform: status
    name: "Status"
    id: sensor_status

  # Make the status LED blink when not connected/trying to connect
  - platform: template
    name: "API connected"
    id: sensor_api_connected
    internal: true
    entity_category: 'diagnostic'
    device_class: 'connectivity'
    lambda: return global_api_server->is_connected();
    on_press:
      - light.turn_off: led_status
    on_release:
      - light.turn_on: led_status

  # Key 1: sends 1_single / 1_double / 1_hold (Moes-style, hold on release); does not touch the relay.
  - platform: gpio
    name: "Button A"
    id: button_a
    pin:
      number: GPIO04
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_multi_click:
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.3s
          - ON for at most 0.4s
          - OFF for at least 0.1s
        then:
          - event.trigger: {id: action, event_type: 1_double}
      - timing:
          - ON for at least 0.8s
          - OFF for at least 0.05s
        then:
          - event.trigger: {id: action, event_type: 1_hold}
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.3s
        then:
          - event.trigger: {id: action, event_type: 1_single}

  # Key 2: sends 2_single / 2_double / 2_hold (Moes-style, hold on release); does not touch the relay.
  - platform: gpio
    name: "Button B"
    id: button_b
    pin:
      number: GPIO00
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_multi_click:
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.3s
          - ON for at most 0.4s
          - OFF for at least 0.1s
        then:
          - event.trigger: {id: action, event_type: 2_double}
      - timing:
          - ON for at least 0.8s
          - OFF for at least 0.05s
        then:
          - event.trigger: {id: action, event_type: 2_hold}
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.3s
        then:
          - event.trigger: {id: action, event_type: 2_single}

  # Key 3: sends 3_single / 3_double / 3_hold (Moes-style, hold on release); does not touch the relay.
  - platform: gpio
    name: "Button C"
    id: button_c
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_multi_click:
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.3s
          - ON for at most 0.4s
          - OFF for at least 0.1s
        then:
          - event.trigger: {id: action, event_type: 3_double}
      - timing:
          - ON for at least 0.8s
          - OFF for at least 0.05s
        then:
          - event.trigger: {id: action, event_type: 3_hold}
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.3s
        then:
          - event.trigger: {id: action, event_type: 3_single}

light:
  # Physical pin to the connection status LED
  # We don't expose this to the HA UI (internal)
  - platform: status_led
    name: "LED"
    id: led_status
    pin:
      number: GPIO05
      inverted: true
    internal: true
    restore_mode: RESTORE_DEFAULT_ON

  # HA UI connection to the background brightness (PWM) pin
  - platform: monochromatic
    output: pwm_output
    name: "Background Brightness"
    restore_mode: RESTORE_DEFAULT_OFF
    icon: 'mdi:led-outline'
    entity_category: 'config'
