# Banyo wall switch (ESP32, 2 relays + 2 keys). Keys only send events; relays are HA switches
# (left: no load, drives its key LED; right: the banyo fan). Written to /config/esphome by configs_deploy (esphome/README.md).
esphome:
  name: "banyo-switchbutton"

esp32:
  board: esp32dev
  framework:
    type: arduino

ota:
  - platform: esphome
    password: !secret ota_password

# Boots into safe mode (OTA only) after repeated failed boots, so a bad install can be fixed over the air.
safe_mode:

# Enable logging
logger:

# Enable Home Assistant API
api:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "banyo-switchbutton"
    password: "banyo-switchbutton"

captive_portal:

sensor:
  - platform: wifi_signal
    name: "RSSI"
    id: sensor_rssi
    update_interval: 90s
    entity_category: "diagnostic"

  - platform: uptime
    name: "Uptime"
    id: sensor_uptime
    update_interval: 300s
    entity_category: "diagnostic"

button:
  - platform: restart
    name: "Restart"
    id: button_restart

  # Reboots into safe mode (OTA only, API off) to test recovery; leaves it after an install or 5 min.
  - platform: safe_mode
    name: "Safe Mode Boot"
    entity_category: "diagnostic"

switch:
  - platform: gpio
    name: "Left"
    pin: GPIO23
    id: relay_1

  - platform: gpio
    name: "Right"
    pin: GPIO19
    id: relay_2
    on_turn_on:
      - output.turn_on: led_2
    on_turn_off:
      - output.turn_off: led_2

output:
  - platform: gpio
    id: led_2
    pin:
      number: GPIO22
      inverted: False

  - platform: ledc
    id: pwm_output
    pin: GPIO18
    frequency: 1000 Hz

# Key presses for the gungors pushbutton wrapper (ha-configs gungors/packages/switchbuttons.yaml):
# event.<device>_action, event types <key>_<single|double|hold>, key 1 = leftmost.
event:
  - platform: template
    name: "Action"
    id: action
    event_types: [1_single, 1_double, 1_hold, 2_single, 2_double, 2_hold]

binary_sensor:
  - platform: status
    name: "Status"
    id: sensor_status

  - platform: template
    name: "API connected"
    id: sensor_api_connected
    internal: True
    entity_category: 'diagnostic'
    device_class: 'connectivity'
    lambda: return global_api_server->is_connected();
    on_press:
      - light.turn_on: led_status
    on_release:
      - light.turn_off: led_status

  # Key 1: sends 1_single / 1_double / 1_hold (Moes-style); does not touch the relay.
  - platform: gpio
    name: "Left"
    pin:
      number: GPIO04
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_multi_click:
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.3s
          - ON for at most 0.4s
          - OFF for at least 0.1s
        then:
          - event.trigger: {id: action, event_type: 1_double}
      - timing:
          - ON for at least 0.8s
        then:
          - event.trigger: {id: action, event_type: 1_hold}
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.3s
        then:
          - event.trigger: {id: action, event_type: 1_single}

  # Key 2: sends 2_single / 2_double / 2_hold (Moes-style); does not touch the relay.
  - platform: gpio
    name: "Right"
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 10ms
    on_multi_click:
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.3s
          - ON for at most 0.4s
          - OFF for at least 0.1s
        then:
          - event.trigger: {id: action, event_type: 2_double}
      - timing:
          - ON for at least 0.8s
        then:
          - event.trigger: {id: action, event_type: 2_hold}
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.3s
        then:
          - event.trigger: {id: action, event_type: 2_single}

light:
  - platform: status_led
    name: "LED"
    id: led_status
    pin:
      number: GPIO05
      inverted: True
    internal: True
    restore_mode: ALWAYS_OFF

  - platform: monochromatic
    output: pwm_output
    name: "LEDs"
    restore_mode: RESTORE_DEFAULT_OFF
    icon: 'mdi:led-outline'
    entity_category: 'config'
