# automation: every `automation:` entry of the gungors packages, one section per topic.

automation:
  # --- banyo_humidity ----------------------------------------------------------------------------
  - id: "banyo_humidity"
    alias: banyo_humidity
    mode: single
    triggers:
      - trigger: template
        value_template: "{{ states('sensor.banyo_moisture_humidity') | float(0) > 45 }}"
        id: "on"
      - trigger: template
        value_template: "{{ states('sensor.banyo_moisture_humidity') | float(0) <= 45 }}"
        id: "off"
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id:
                  - "on"
            sequence:
              - action: fan.turn_on
                metadata: {}
                data: {}
                target:
                  entity_id: fan.banyo_fan
          - conditions: []
            sequence:
              - action: fan.turn_off
                metadata: {}
                data: {}
                target:
                  entity_id: fan.banyo_fan

  # --- certificate -------------------------------------------------------------------------------
  # Certificate: renews the Let's Encrypt certificate of gungors.duckdns.org a week before it
  # expires (checked daily at 11:59) and restarts Home Assistant to load it.
  # Moved from the UI (automations.yaml); the id is kept so the entity keeps its history.
  - id: "1726335987058"
    alias: certificate_renew
    description: ""
    use_blueprint:
      path: TJ-developer/renew_ssl_cert.yaml
      input:
        cert_expiry_sensor: sensor.gungors_duckdns_org_cert_expiry
        renew_date: 7
        restart_after_renewal: true
        notification_device: da9404280c191461757a38244e80a39b
        notification_title: Certificate renewed.
        notification_message: Restarting homeassistant...
        time_to_check_cert: "11:59:00"
        send_notification: false

  # --- heating -----------------------------------------------------------------------------------
  # Misafir PID seed: on heat -> off after a run of at least 2 h, store the last pid_i in
  # input_number.misafir_pid_seed; on off -> heat, after the pid has cleared its integral, seed it
  # back with gungors.clear_integral so the valve starts near its steady opening.
  - id: misafir_pid_seed
    alias: misafir_pid_seed
    mode: queued
    triggers:
      - trigger: state
        entity_id: climate.misafir
        from: heat
        to: "off"
        id: store
      - trigger: state
        entity_id: climate.misafir
        from: "off"
        to: heat
        id: seed
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: store
              - condition: template
                value_template: >-
                  {{ (as_timestamp(trigger.to_state.last_changed)
                      - as_timestamp(trigger.from_state.last_changed)) >= 7200
                     and trigger.from_state.attributes.pid_i | float(0) > 0 }}
            sequence:
              - action: input_number.set_value
                target:
                  entity_id: input_number.misafir_pid_seed
                data:
                  value: "{{ [trigger.from_state.attributes.pid_i | float(0), 100] | min | round(1) }}"
          - conditions:
              - condition: trigger
                id: seed
              - condition: numeric_state
                entity_id: input_number.misafir_pid_seed
                above: 0
            sequence:
              - delay: {seconds: 2}
              - action: gungors.clear_integral
                target:
                  entity_id: climate.misafir
                data:
                  value: "{{ states('input_number.misafir_pid_seed') | float(0) }}"

  # Mirrors binary_sensor.kombi_talebi onto the (hidden) boiler relay. Also resyncs
  # at startup and whenever the relay reports on/off (manual change, or back from
  # unavailable). While the relay is unavailable nothing is sent.
  - alias: thermostat_switch
    id: thermostat_switch
    description: ""
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.kombi_talebi
      - trigger: state
        entity_id: switch.koridor2_switch
        to: ["on", "off"]
      - trigger: homeassistant
        event: start
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.kombi_talebi
                state: "on"
              - condition: state
                entity_id: switch.koridor2_switch
                state: "off"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.koridor2_switch
          - conditions:
              - condition: state
                entity_id: binary_sensor.kombi_talebi
                state: "off"
              - condition: state
                entity_id: switch.koridor2_switch
                state: "on"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.koridor2_switch
