# automation: every `automation:` entry of the gungors packages, one section per topic.

automation:
  # --- banyo_humidity ----------------------------------------------------------------------------
  - id: "banyo_humidity"
    alias: banyo_humidity
    mode: single
    triggers:
      - trigger: template
        value_template: "{{ states('sensor.banyo_moisture_humidity') | float(0) > 45 }}"
        id: "on"
      - trigger: template
        value_template: "{{ states('sensor.banyo_moisture_humidity') | float(0) <= 45 }}"
        id: "off"
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id:
                  - "on"
            sequence:
              - action: fan.turn_on
                metadata: {}
                data: {}
                target:
                  entity_id: fan.banyo_fan
          - conditions: []
            sequence:
              - action: fan.turn_off
                metadata: {}
                data: {}
                target:
                  entity_id: fan.banyo_fan

  # --- certificate -------------------------------------------------------------------------------
  # Certificate: renews the Let's Encrypt certificate of gungors.duckdns.org a week before it
  # expires (checked daily at 11:59) and restarts Home Assistant to load it.
  # Moved from the UI (automations.yaml); the id is kept so the entity keeps its history.
  - id: "1726335987058"
    alias: certificate_renew
    description: ""
    use_blueprint:
      path: TJ-developer/renew_ssl_cert.yaml
      input:
        cert_expiry_sensor: sensor.gungors_duckdns_org_cert_expiry
        renew_date: 7
        restart_after_renewal: true
        notification_device: da9404280c191461757a38244e80a39b
        notification_title: Certificate renewed.
        notification_message: Restarting homeassistant...
        time_to_check_cert: "11:59:00"
        send_notification: false

  # --- heating -----------------------------------------------------------------------------------
  # Mirrors binary_sensor.kombi_talebi onto the (hidden) boiler relay. Also resyncs
  # at startup and whenever the relay reports on/off (manual change, or back from
  # unavailable). While the relay is unavailable nothing is sent.
  - alias: thermostat_switch
    id: thermostat_switch
    description: ""
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.kombi_talebi
      - trigger: state
        entity_id: switch.koridor2_switch
        to: ["on", "off"]
      - trigger: homeassistant
        event: start
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.kombi_talebi
                state: "on"
              - condition: state
                entity_id: switch.koridor2_switch
                state: "off"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.koridor2_switch
          - conditions:
              - condition: state
                entity_id: binary_sensor.kombi_talebi
                state: "off"
              - condition: state
                entity_id: switch.koridor2_switch
                state: "on"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.koridor2_switch

  # --- tv_muzik ----------------------------------------------------------------------------------
  # Background music on the living-room TV (Philips Android TV, media_player.gungors_tv_2). While
  # Fully Kiosk (the floor plan) or the Immich app has been in front for 10 s, Music Assistant
  # plays the NAS music share (\\192.168.0.222\muzik, HA network storage "Fonmuzigi", MA
  # Filesystem provider) shuffled on repeat through Snapdroid, the Snapcast client on the TV
  # (media_player.tv_muzik, plays in the background behind any app). Another app in front, or the
  # TV off: pause; back to Fully/Immich: resume.
  # Folder per app: the `background_folder` attribute of sensor.immich_processing (Immich) and
  # sensor.floorplan_3d (Fully), set in the gungors integration (Servisler); a folder inside the
  # share, empty or missing = the whole share. Volume: the player stays at 100 %, the TV remote
  # sets the loudness. If Snapdroid is not running (player unavailable) it is opened and the app
  # that was in front is opened again.
  - id: "tv_muzik"
    alias: tv_muzik
    description: Background music on the TV while Fully Kiosk or Immich is in front.
    mode: restart
    triggers:
      - trigger: state
        entity_id: media_player.gungors_tv_2
        attribute: app_id
        for: "00:00:10"
      - trigger: state
        entity_id: media_player.gungors_tv_2
        to: null
        for: "00:00:10"
      - trigger: homeassistant
        event: start
    variables:
      tv: media_player.gungors_tv_2
      player: media_player.tv_muzik
      app: "{{ state_attr('media_player.gungors_tv_2', 'app_id') }}"
      folder_sensor: >-
        {{ 'sensor.immich_processing' if app == 'nl.giejay.android.tv.immich' else 'sensor.floorplan_3d' }}
      folder: "{{ (state_attr(folder_sensor, 'background_folder') or '') | trim('/') }}"
      # Fully <-> Immich with different folders: start the other folder instead of resuming.
      music_apps: ["de.ozerov.fully", "nl.giejay.android.tv.immich"]
      prev_app: >-
        {{ trigger.from_state.attributes.get('app_id') if trigger.platform == 'state'
           and trigger.from_state is not none else none }}
      prev_folder: >-
        {% set s = 'sensor.immich_processing' if prev_app == 'nl.giejay.android.tv.immich' else 'sensor.floorplan_3d' %}
        {{ (state_attr(s, 'background_folder') or '') | trim('/') }}
      new_folder: "{{ prev_app in music_apps and prev_app != app and prev_folder != folder }}"
    actions:
      - if:
          - condition: state
            entity_id: media_player.gungors_tv_2
            state: "on"
          - condition: state
            entity_id: media_player.gungors_tv_2
            attribute: app_id
            state:
              - de.ozerov.fully
              - nl.giejay.android.tv.immich
        then:
          # Snapdroid not running: open it (it starts its client by itself), then the app again.
          - if:
              - condition: state
                entity_id: media_player.tv_muzik
                state: unavailable
            then:
              - action: media_player.play_media
                target:
                  entity_id: media_player.gungors_tv_2
                data:
                  media_content_type: app
                  media_content_id: de.badaix.snapcast
              - delay: "00:00:04"
              - action: media_player.play_media
                target:
                  entity_id: media_player.gungors_tv_2
                data:
                  media_content_type: app
                  media_content_id: "{{ app }}"
              - wait_template: "{{ not is_state('media_player.tv_muzik', 'unavailable') }}"
                timeout: "00:00:45"
                continue_on_timeout: false
          - choose:
              # Same folder still queued and paused: resume.
              - conditions:
                  - condition: state
                    entity_id: media_player.tv_muzik
                    state: paused
                  - condition: template
                    value_template: "{{ not new_folder }}"
                sequence:
                  - action: media_player.media_play
                    target:
                      entity_id: media_player.tv_muzik
              - conditions:
                  - condition: state
                    entity_id: media_player.tv_muzik
                    state: playing
                  - condition: template
                    value_template: "{{ not new_folder }}"
                sequence: []
            default:
              - action: music_assistant.get_library
                data:
                  config_entry_id: 01M82BKBN5Z4XFJ1RFCPHBDEF7
                  media_type: track
                  limit: 500
                  order_by: random
                response_variable: library
              - variables:
                  tracks: >-
                    {% set ns = namespace(uris=[]) %}
                    {% for t in library['items'] %}
                      {% set path = t.uri.split('://track/', 1)[1] if '://track/' in t.uri else '' %}
                      {% if t.uri.startswith('filesystem') and (folder == '' or path.startswith(folder ~ '/')) %}
                        {% set ns.uris = ns.uris + [t.uri] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.uris }}
              - condition: template
                value_template: "{{ tracks | count > 0 }}"
              - action: media_player.volume_set
                target:
                  entity_id: media_player.tv_muzik
                data:
                  volume_level: 1
              - action: music_assistant.play_media
                target:
                  entity_id: media_player.tv_muzik
                data:
                  media_id: "{{ tracks }}"
                  media_type: track
                  enqueue: replace
              - action: media_player.shuffle_set
                target:
                  entity_id: media_player.tv_muzik
                data:
                  shuffle: true
              - action: media_player.repeat_set
                target:
                  entity_id: media_player.tv_muzik
                data:
                  repeat: all
        else:
          - condition: state
            entity_id: media_player.tv_muzik
            state: playing
          - action: media_player.media_pause
            target:
              entity_id: media_player.tv_muzik
