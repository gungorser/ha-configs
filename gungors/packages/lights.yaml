# Lights: gungors wrappers (ha-integrations README, Features) for every light on the floor
# plans (floorplan_3d and the old 2D floorplan). Each wrapper has the light's old entity id;
# the Zigbee2MQTT original is renamed to light.phys_<room>_light and hidden (dashboards and
# automations use the wrapper). `link` mirrors the original and sends commands to it.

light:
  - platform: gungors
    name: banyo_light
    unique_id: banyo_light
    features:
      - program
      - link: light.phys_banyo_light

  - platform: gungors
    name: bebek_light
    unique_id: bebek_light
    features:
      - program
      - link: light.phys_bebek_light

  - platform: gungors
    name: araba_light
    unique_id: araba_light
    features:
      - program
      - link: light.phys_araba_light

  - platform: gungors
    name: garaj_light
    unique_id: garaj_light
    features:
      - program
      - link: light.phys_garaj_light

  - platform: gungors
    name: balkon_light
    unique_id: kaan_light    # the balcony lamp, once kaan_light: the old unique_id keeps its history
    features:
      - program
      - link: light.phys_balkon_light

  - platform: gungors
    name: koridor0_light
    unique_id: koridor0_light
    features:
      - program
      - link: light.phys_koridor0_light

  - platform: gungors
    name: koridor1_light
    unique_id: koridor1_light
    features:
      - program
      - link: light.phys_koridor1_light

  - platform: gungors
    name: salon_light
    unique_id: salon_light
    features:
      - program
      - link: light.phys_salon_light

  - platform: gungors
    name: sercan_light
    unique_id: sercan_light
    features:
      - program
      - link: light.phys_sercan_light

  - platform: gungors
    name: yatak_light
    unique_id: yatak_light
    features:
      - program
      - link: light.phys_yatak_light

  - platform: gungors
    name: yemek_light
    unique_id: yemek_light
    features:
      - program
      - link: light.phys_yemek_light

  - platform: gungors
    name: koridor2_light
    unique_id: koridor2_light
    features:
      - program
      - link: light.phys_koridor2_light

  - platform: gungors
    name: melike_light
    unique_id: melike_light
    features:
      - program
      - link: light.phys_melike_light

  - platform: gungors
    name: misafir_light
    unique_id: misafir_light
    features:
      - program
      - link: light.phys_misafir_light

  - platform: gungors
    name: tavan_light_2
    unique_id: tavan_light_2
    features:
      - program
      - link: light.phys_tavan2_light

  # mutfak: a relay (switch.yemek_2) without a light entity of its own.
  - platform: gungors
    name: mutfak_light
    unique_id: mutfak_light
    features:
      - program
      - link: switch.yemek_2

  # bahce: garden lamp 1 on its own, and the group of all garden lights (the lamp 1 wrapper,
  # the UI group light.bahce_light_2 and the physical lamp 3).
  - platform: gungors
    name: bahce_light_1
    unique_id: bahce_light_1
    features:
      - program
      - link: light.phys_bahce1_light

  - platform: gungors
    name: bahce_light
    unique_id: bahce_light
    features:
      - link:
          - light.bahce_light_1
          - light.bahce_light_2
          - light.phys_bahce3_light
