automation:
  - id: tv_bg_music
    alias: tv_bg_music
    description: Background music on the TV while Fully Kiosk or Immich is in front.
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.tv_foreground_app
      - trigger: homeassistant
        event: start
    variables:
      app: "{{ states('sensor.tv_foreground_app') }}"
      target_apps:
        - de.ozerov.fully
        - nl.giejay.android.tv.immich
    actions:
      - if:
          - condition: template
            value_template: "{{ app in target_apps }}"
        then:
          - if:
              - condition: state
                entity_id: media_player.tv_muzik
                state: unavailable
            then:
              - action: media_player.play_media
                target:
                  entity_id: media_player.gungors_tv_2
                data:
                  media:
                    media_content_id: de.badaix.snapcast
                    media_content_type: app
              - delay: "00:00:04"
              - action: media_player.play_media
                target:
                  entity_id: media_player.gungors_tv_2
                data:
                  media:
                    media_content_id: "{{ app }}"
                    media_content_type: app
              - wait_template: "{{ not is_state('media_player.tv_muzik', 'unavailable') }}"
                timeout: "00:00:45"
                continue_on_timeout: false
          - action: media_player.media_play
            target:
              entity_id: media_player.tv_muzik
        else:
          - condition: state
            entity_id: media_player.tv_muzik
            state: playing
          - action: media_player.media_pause
            target:
              entity_id: media_player.tv_muzik

template:
  - trigger:
      - trigger: time_pattern
        seconds: "/5"
    action:
      - condition: not
        conditions:
          - condition: state
            entity_id: media_player.gungors_tv_2
            state:
              - "off"
              - unavailable
              - unknown
      - action: androidtv.adb_command
        target:
          entity_id: media_player.gungors_tv_adb
        data:
          command: "dumpsys activity activities | grep mResumedActivity"
    sensor:
      - name: TV Foreground App
        unique_id: tv_foreground_app
        state: >-
          {% if is_state('media_player.gungors_tv_2', ['off', 'unavailable', 'unknown']) %}
            off
          {% else %}
            {% set resp = state_attr('media_player.gungors_tv_adb', 'adb_response') or '' %}
            {% set matches = resp | regex_findall('u0 ([^/]+)/') %}
            {{ matches[0] if matches | count > 0 else 'unknown' }}
          {% endif %}
