# climate: every `climate:` entry of the gungors packages, one section per topic.

climate:
  # --- heating -----------------------------------------------------------------------------------
  # Heating: gungors thermostats (climate), the heating demand sensor and
  # the boiler relay automation. Previously split over thermostats/climates.yaml and
  # thermostats/switch_automation.yaml.
  # gungors thermostats (ha-integrations README, Features). TRV rooms: the PID turns the room
  # temperature into a demand 0-100, `valve` maps it onto the TRV valve opening/closing degree
  # (min = minimum opening %), `link` is the TRV: the wrapper's mode and target are the
  # TRV's (no own state, no sync; unavailable while the TRV is; the TRV's min_temp is used).
  # force_off: false keeps SmartThermostat's old force_off_state: false.

  - platform: gungors
    name: sercan
    unique_id: sercan_thermostat
    max_temp: 35
    features:
      - program:
          preheat: {rate: 1.5}  # °C/h: reach a program's set temperature by its start
      - pid:
          kp: 16
          ki: 0.01
          kd: 4
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - valve:
          opening: number.phys_sercan_climate_valve_opening_degree
          closing: number.phys_sercan_climate_valve_closing_degree
          min: 10
      - temperature: sensor.sercan_sensor_temperature
      - link: climate.phys_sercan_climate

  - platform: gungors
    name: misafir
    unique_id: misafir_thermostat
    max_temp: 35
    features:
      - program:
          preheat: {rate: 1.5}  # °C/h: reach a program's set temperature by its start
      - pid:
          kp: 90
          ki: 0.08
          kd: 80
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - valve:
          opening: number.phys_misafir_climate_valve_opening_degree
          closing: number.phys_misafir_climate_valve_closing_degree
      - temperature: sensor.misafir_sensor_temperature
      - link: climate.phys_misafir_climate

  - platform: gungors
    name: bebek
    unique_id: bebek_thermostat
    max_temp: 35
    features:
      - program:
          preheat: {rate: 1.5}  # °C/h: reach a program's set temperature by its start
      - pid:
          kp: 30
          ki: 0.01  # the sensor reports hourly: 0.06 swung the integral 0-65 per sample
          kd: 80
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - valve:
          opening: number.phys_bebek_climate_valve_opening_degree
          closing: number.phys_bebek_climate_valve_closing_degree
      - temperature: sensor.bebek_sensor_temperature
      - link: climate.phys_bebek_climate

  - platform: gungors
    name: melike
    unique_id: melike_thermostat
    max_temp: 35
    features:
      - program:
          preheat: {rate: 1.5}  # °C/h: reach a program's set temperature by its start
      - pid:
          kp: 40
          ki: 0.02
          kd: 60
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - valve:
          opening: number.phys_melike_climate_valve_opening_degree
          closing: number.phys_melike_climate_valve_closing_degree
      - temperature: sensor.melike_sensor_temperature
      - link: climate.phys_melike_climate

  - platform: gungors
    name: banyo
    unique_id: banyo_thermostat
    max_temp: 35
    features:
      - program:
          preheat: {rate: 1.5}  # °C/h: reach a program's set temperature by its start
      - pid:
          kp: 50
          ki: 0.02
          kd: 60
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - valve:
          opening: number.phys_banyo_climate_valve_opening_degree
          closing: number.phys_banyo_climate_valve_closing_degree
      - temperature: sensor.banyo_moisture_temperature
      - link: climate.phys_banyo_climate

  - platform: gungors
    name: yatak
    unique_id: yatak_thermostat
    max_temp: 35
    features:
      - program:
          preheat: {rate: 1.5}  # °C/h: reach a program's set temperature by its start
      - pid:
          kp: 40
          ki: 0.05
          kd: 60
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - valve:
          opening: number.phys_yatak_climate_valve_opening_degree
          closing: number.phys_yatak_climate_valve_closing_degree
          min: 10
      - temperature: sensor.yatak_sensor_temperature
      - link: climate.phys_yatak_climate

  # salon: the boiler circuit thermostat (EMS-ESP hc1) and a socket heater driven by PWM.
  - platform: gungors
    name: salon
    unique_id: salon_thermostat
    max_temp: 35
    features:
      - program:
          preheat: {rate: 1.0}  # °C/h: reach a program's set temperature by its start
      - pid:
          kp: 150
          ki: 0
          kd: 0
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - pwm:
          entity: switch.koridor0_socket
          period: "00:15:00"
          min_cycle_duration: 60
      - temperature: sensor.thermostat_hc1_currtemp
      - link: climate.thermostat_hc1
