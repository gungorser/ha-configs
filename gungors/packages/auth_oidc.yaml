# auth_oidc: login with Authelia (LLDAP users) on the HA login screen, via hass-oidc-auth (HACS
# christiaangoossens/hass-oidc-auth). The client `homeassistant` is defined in
# auth/authelia/configuration.yml: public client with PKCE, so no secret exists anywhere.
# HA's own username/password login stays as the fallback.

auth_oidc:
  client_id: homeassistant
  discovery_url: https://auth.gungors.duckdns.org/.well-known/openid-configuration
  display_name: Authelia
  features:
    # LLDAP uid (preferred_username) logs in as the HA user with the same username (sercan,
    # melike) instead of creating a new one.
    automatic_user_linking: true
    # HA sits behind NPM: build the https callback even if a request arrives as http.
    force_https: true
  roles:
    admin: admin    # LLDAP group admin -> HA administrator
    user: aile      # LLDAP group aile -> HA user; anyone in neither group is refused
