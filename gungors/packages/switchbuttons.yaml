# Switchbuttons: the ESPHome wall switches (esphome/banyo-switchbutton.yaml,
# esphome/yemek-switchbutton.yaml) as gungors pushbutton wrappers, like pushbuttons.yaml. The keys
# only send events (event.<device>_action: <key>_single|double|hold, key 1 = leftmost); the
# relays are HA switches. Door on the left at both: key 1 is near the door.
#
# The relays without a load (switch.banyo_left, switch.yemek_1, switch.yemek_3) drive their key
# LEDs (the LEDs are wired to the relays); nothing drives them until the gungors indicator feature.
# switch.yemek_2 is the mutfak lamp, switch.banyo_right the banyo fan.

event:
  - platform: gungors
    name: banyo_switchbutton
    unique_id: banyo_switchbutton
    keys: 2
    door: left
    features:
      - buttons:
          - light                                                    # 1: banyo
      - custom:                                                      # 2: the fan
          2_single: {action: fan.toggle, target: {entity_id: fan.banyo_fan}}
      - link: event.banyo_switchbutton_action

  - platform: gungors
    name: yemek_switchbutton
    unique_id: yemek_switchbutton
    keys: 3
    door: left
    features:
      - buttons:
          - light                                                        # 1: yemek
          - light: {button: 2, target: {entity_id: light.mutfak_light}}  # 2: mutfak
          - light: {button: 3, target: {area_id: [veranda, avlu, bahce]}}  # 3: the whole garden
      - link: event.yemek_switchbutton_action
