# Certificate: renews the Let's Encrypt certificate of gungors.duckdns.org a week before it
# expires (checked daily at 11:59) and restarts Home Assistant to load it.
# Moved from the UI (automations.yaml); the id is kept so the entity keeps its history.

automation:
  - id: "1726335987058"
    alias: certificate_renew
    description: ""
    use_blueprint:
      path: TJ-developer/renew_ssl_cert.yaml
      input:
        cert_expiry_sensor: sensor.gungors_duckdns_org_cert_expiry
        renew_date: 7
        restart_after_renewal: true
        notification_device: da9404280c191461757a38244e80a39b
        notification_title: Certificate renewed.
        notification_message: Restarting homeassistant...
        time_to_check_cert: "11:59:00"
        send_notification: false
