# event: every `event:` entry of the gungors packages, one section per topic.

event:
  # --- pushbuttons -------------------------------------------------------------------------------
  # Pushbuttons: gungors wrappers (ha-integrations README, Pushbuttons) for the Moes scene
  # remotes on Zigbee2MQTT. Each wrapper links the device's Z2M event entity
  # (event.<device>_action; Z2M's Home Assistant option for event entities must be on) and acts
  # on its presses. Targets are the device's area unless a `target` is given.
  #
  # Location rule: `keys` is how many keys the device has, `door` the side of the door it is on
  # (Moes key 1 is the leftmost). light goes on the key nearest the door, cover on the farthest,
  # and on the middle key of a three-key device climate (single), program (double) and custom
  # (hold). A function's `button` overrides its key (two-key devices have no middle key; without
  # `door` every function gives one), its `target` the target.
  #
  # - light: single off / on (default preset); double brightness dim <-> default; hold colour
  #   night <-> default (presets in gungors.yaml).
  # - climate: toggles (lights blink once: green on, blue off).
  # - program: starts / stops a timeless program (two blinks).
  # - cover: single open, double close (physical: also with the window open), a press while it
  #   moves stops it; hold closes the whole floor with a backup scene, or restores it.
  # - A press a program rule limits is applied as the rule allows; the lights blink red twice.
  # No door at the garden: the light names its key.
  - platform: gungors
    name: bahce
    unique_id: bahce_pushbutton
    keys: 2
    features:
      - buttons:
          - light: {button: 1, target: {area_id: [veranda, avlu, bahce]}}  # the whole garden
      - link: event.bahce_pushbutton_action

  - platform: gungors
    name: garaj
    unique_id: garaj_pushbutton
    keys: 1
    features:
      - buttons:
          - light
      - link: event.gardirop_pushbutton_action

  - platform: gungors
    name: koridor0
    unique_id: koridor0_pushbutton
    keys: 2
    door: right
    features:
      - buttons:
          - light                                          # 2: koridor0
          - light: {button: 1, target: {area_id: araba}}   # 1: araba
      - link: event.koridor0_pushbutton_action

  - platform: gungors
    name: koridor1
    unique_id: koridor1_pushbutton
    keys: 2
    door: left
    features:
      - buttons:
          - light
          - cover
      - link: event.koridor1_pushbutton_action

  - platform: gungors
    name: koridor2
    unique_id: koridor2_pushbutton
    keys: 2
    door: left
    features:
      - buttons:
          - light
          - light: {button: 2, target: {entity_id: light.tavan}}
      - link: event.koridor2_pushbutton_action

  - platform: gungors
    name: melike
    unique_id: melike_pushbutton
    keys: 2
    door: left
    features:
      - buttons:
          - light
          - climate: {button: 2}
      - link: event.melike_pushbutton_action

  - platform: gungors
    name: bebek
    unique_id: bebek_pushbutton
    keys: 3
    door: right
    features:
      - buttons:
          - light
          - cover
          - climate
          - program: {program: "Kaan gündüz uyku", duration: "03:00:00"}  # at most 3 h
      - link: event.bebek_pushbutton_action

  - platform: gungors
    name: sercan
    unique_id: sercan_pushbutton
    keys: 3
    door: left
    features:
      - buttons:
          - light
          - cover
          - climate
          - custom:  # the monitors' outlet
              action: switch.toggle
              target: {entity_id: switch.sercan_plug}
      - link: event.sercan_pushbutton_action

  - platform: gungors
    name: yatak
    unique_id: yatak_pushbutton
    keys: 3
    door: right
    features:
      - buttons:
          - light
          - cover
          - climate
      - link: event.yatak_pushbutton_action

  - platform: gungors
    name: misafir
    unique_id: misafir_pushbutton
    keys: 3
    door: right
    features:
      - buttons:
          - light
          - cover
          - climate
      - link: event.misafir_pushbutton_action

  # --- switchbuttons -----------------------------------------------------------------------------
  # Switchbuttons: the ESPHome wall switches (esphome/banyo-switchbutton.yaml,
  # esphome/yemek-switchbutton.yaml) as gungors pushbutton wrappers, like the Moes pushbuttons above. The keys
  # only send events (event.<device>_action: <key>_single|double|hold, key 1 = leftmost); the
  # relays are HA switches. Door on the left at both: key 1 is near the door.
  #
  # The relays without a load (switch.banyo_left, switch.yemek_1, switch.yemek_3) drive their key
  # LEDs (the LEDs are wired to the relays): the gungors `relay` feature switches each on while its
  # key's lights are on. switch.yemek_2 is the mutfak lamp, switch.banyo_right the banyo fan (their
  # LEDs follow the load).
  - platform: gungors
    name: banyo
    unique_id: banyo_switchbutton
    keys: 2
    door: left
    features:
      - buttons:
          - light                                                    # 1: banyo
      - custom:                                                      # 2: the fan
          2_single: {action: fan.toggle, target: {entity_id: fan.banyo_fan}}
      - relay:
          1: switch.banyo_left                                       # key 1 LED
      - link: event.banyo_switchbutton_action

  - platform: gungors
    name: yemek
    unique_id: yemek_switchbutton
    keys: 3
    door: left
    features:
      - buttons:
          - light                                                        # 1: yemek
          - light: {button: 2, target: {entity_id: light.mutfak}}  # 2: mutfak
          - light: {button: 3, target: {area_id: [veranda, avlu, bahce]}}  # 3: the whole garden
      - relay:                                                           # key LEDs
          1: switch.yemek_1
          3: switch.yemek_3
      - link: event.yemek_switchbutton_action
