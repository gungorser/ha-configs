# Covers: every cover with a device is a gungors wrapper (ha-integrations): IKEA blinds and Tuya
# curtains. The covers without a device (manual or not connected yet) are only a position number
# below, which floorplan_3d shows directly (no wrapper).

# --- Covers without a device ---------------------------------------------------------
# Kitchen (mutfak) and dining (yemek) blinds, the small living room curtain (salon kucuk),
# the bathroom (banyo) blind, the attic hall (koridor2) window blind, the blind of melike's
# roof window, the garage door and the sliding doors of the kat2 wardrobes (melike, misafir):
# a position number each, 0-100 (0 closed).
# `initial` is the position after a restart or a reload of input numbers; change it here. Set the
# number by hand (the floorplan_3d dashboard's configs tab) when the real cover is moved; for a
# real device later, add a gungors cover linking it.
input_number:
  mutfak_cover_position:
    name: Mutfak cover position
    initial: 100 # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:roller-shade

  yemek_cover_position:
    name: Yemek cover position
    initial: 100 # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:roller-shade

  salon_kucuk_cover_position:
    name: Salon kucuk cover position
    initial: 100 # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:curtains

  banyo_cover_position:
    name: Banyo cover position
    initial: 100 # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:roller-shade

  koridor2_cover_position:
    name: Koridor2 cover position
    initial: 100 # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:roller-shade

  melike_cover_position:
    name: Melike cover position
    initial: 0   # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:roller-shade

  garaj_door_position:
    name: Garaj door position
    initial: 0   # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:garage

  melike_dolap_kapi_position:
    name: Melike dolap kapi position
    initial: 0   # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:door-sliding

  misafir_dolap_kapi_position:
    name: Misafir dolap kapi position
    initial: 0   # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:door-sliding

cover:
  # gungors covers (ha-integrations README, Features): a domain base plus a `features:` list,
  # combined in list order. `link` (always last) is the original the wrapper drives; dashboards
  # and automations use the wrapper, never the original. `program` (first): follows
  # calendar.program (gungors/packages/program.yaml) and opens at sunrise / closes at sunset. In yatak the group carries it (area-targeted rules see the group, not the three blinds).

  # --- IKEA blinds -------------------------------------------------------------------
  # direction: movement tracking (opening/closing, real position while moving).
  # window: remote commands are held while the window is open; wall button presses come
  # from the gungors pushbuttons (pushbuttons.yaml) as physical requests (allowed with the
  # window open).
  - platform: gungors
    name: sercan_cover
    unique_id: sercan_cover
    device_class: blind
    features:
      - program
      - window: binary_sensor.sercan_window_contact
      - direction
      - link: cover.phys_sercan_cover

  - platform: gungors
    name: bebek_cover
    unique_id: bebek_cover
    device_class: blind
    features:
      - program
      - window: binary_sensor.bebek_window_contact
      - direction
      - link: cover.phys_bebek_cover

  - platform: gungors
    name: yatak_cover_window
    unique_id: yatak_cover_window
    device_class: blind
    features:
      - window: binary_sensor.yatak_window_contact
      - direction
      - link: cover.phys_yatakwindow_cover

  # No window sensor: nothing to guard.
  - platform: gungors
    name: koridor1_cover
    unique_id: koridor1_cover
    device_class: blind
    features:
      - program
      - direction
      - link: cover.phys_koridor1_cover

  # Yatak: the two blinds without a window contact (the middle glass and the balcony door), and
  # the group of all three, which carries `program` for the room (the members have none, so
  # commands are not sent twice).
  - platform: gungors
    name: yatak_cover_middle
    unique_id: yatak_cover_1  # the middle (glass) blind, once yatak_cover_1: the old unique_id keeps its history
    device_class: blind
    features:
      - direction
      - link: cover.phys_yatakmiddle_cover

  - platform: gungors
    name: yatak_cover_door
    unique_id: yatak_cover_3  # the balcony door blind, once yatak_cover_3: the old unique_id keeps its history
    device_class: blind
    features:
      - direction
      - link: cover.phys_yatakdoor_cover

  - platform: gungors
    name: yatak_cover
    unique_id: yatak_cover
    device_class: blind
    features:
      - program
      - link:
          - cover.yatak_cover_window
          - cover.yatak_cover_middle
          - cover.yatak_cover_door

  # --- Tuya curtains -----------------------------------------------------------------
  # travel_time: the motors report no position while moving; the wrapper estimates it from
  # learned full-run times (open_time / close_time) and takes the real position from stop /
  # end-of-move reports. invert: the motor's open is the room's close (Z2M's invert_cover
  # only flips positions for this device, so it is left as it was).
  - platform: gungors
    name: salon_cover
    unique_id: salon_cover
    device_class: curtain
    features:
      - program
      - invert
      - travel_time
      - link: cover.phys_salon_cover

  - platform: gungors
    name: misafir_cover
    unique_id: misafir_cover
    device_class: curtain
    features:
      - program
      - invert
      - travel_time
      - link: cover.phys_misafir_cover

script:
  # Single-tap behaviour for covers on dashboards (used by floorplan.yaml).
  # Unlike cover.toggle it does not depend on the last move's direction:
  # moving -> stop, closed -> open, anything else (open or partly open) -> close.
  cover_tap:
    alias: cover_tap
    description: Stop if moving, open if closed, otherwise close
    mode: parallel
    max: 20
    fields:
      cover:
        description: Cover entity id
    sequence:
      - choose:
          - conditions: "{{ states(cover) in ['opening', 'closing'] }}"
            sequence:
              - action: cover.stop_cover
                target:
                  entity_id: "{{ cover }}"
          - conditions: "{{ is_state(cover, 'closed') }}"
            sequence:
              - action: cover.open_cover
                target:
                  entity_id: "{{ cover }}"
        default:
          - action: cover.close_cover
            target:
              entity_id: "{{ cover }}"
