          - <<: *room_light
            entity: light.koridor0_light
            style: {left: 46%, top: 52%}
          - <<: *room_light
            entity: light.yemek_light
            style: {left: 25%, top: 70%}
          - <<: *room_light
            entity: light.garaj_light
            style: {left: 73%, top: 76%}
          - <<: *room_light
            entity: light.mutfak_light
            style: {left: 46%, top: 72%}
          - <<: *room_light
            entity: light.salon_light
            style: {left: 42%, top: 34%}
          - <<: *room_light
            entity: light.avlu_light
            style: {left: 37%, top: 84%}
          - <<: *room_light
            entity: light.bahce_light
            style: {left: 10%, top: 95%}
          # icons
          - *forecast
          - *sercan
          - *melike
          - <<: *toggle_icon
            entity: valve.bahce_valve
            style: {left: 57%, top: 84%}
          - type: state-icon
            entity: media_player.salon_tv
            style: {left: 20%, top: 37%}
          - type: state-icon
            entity: vacuum.xiaomi_c102gl_9267_robot_cleaner
            style: {left: 21%, top: 44%}
          # climate
          - <<: *room_climate
            entity: climate.salon_thermostat
            style: {top: 44%, left: 44%}
          - <<: *cover_icon
            entity: cover.salon_cover
            tap_action: {action: perform-action, perform_action: script.cover_tap, data: {cover: cover.salon_cover}}
            style: {left: 30%, top: 18%}
          # cameras
          - type: conditional
            title: camera.backyard off
            conditions:
              - condition: state
                entity: camera.backyard
                state_not: streaming
            elements:
              - type: state-icon
                entity: camera.backyard
                icon: mdi:cctv-off
                tap_action:
                  action: perform-action
                  perform_action: camera.turn_on
                  target:
                    device_id: 2c981aaa4add512f53f9b132a7ba4149
                hold_action:
                  action: none
                style: {left: 10%, top: 84%}
          - type: conditional
            title: camera.backyard on
            conditions:
              - condition: state
                entity: camera.backyard
                state: streaming
            elements:
              - type: state-icon
                entity: camera.backyard
                icon: mdi:cctv
                tap_action:
                  action: more-info
                hold_action:
                  action: perform-action
                  perform_action: camera.turn_off
                  target:
                    device_id: 2c981aaa4add512f53f9b132a7ba4149
                style: {left: 10%, top: 84%}
          - type: conditional
            title: camera.doorbell off
            conditions:
              - condition: state
                entity: camera.doorbell
                state_not: streaming
            elements:
              - type: state-icon
                entity: camera.doorbell
                icon: mdi:cctv-off
                tap_action:
                  action: perform-action
                  perform_action: camera.turn_on
                  target:
                    device_id: 794213408a22e95b1d0799233ef0e625
                hold_action:
                  action: none
                style: {left: 63%, top: 50%}
          - type: conditional
            title: camera.doorbell on
            conditions:
              - condition: state
                entity: camera.doorbell
                state: streaming
            elements:
              - type: state-icon
                entity: camera.doorbell
                icon: mdi:cctv
                tap_action:
                  action: more-info
                hold_action:
                  action: perform-action
                  perform_action: camera.turn_off
                  target:
                    device_id: 794213408a22e95b1d0799233ef0e625
                style: {left: 63%, top: 50%}

