# Floorplan dashboard. Shared blocks are defined once under `anchors` (ignored by Lovelace)
# and merged into elements with `<<:`. Merge is shallow: `style` is rebuilt per element
# from the smaller style anchors plus its own position.
# Room climates and lights use the parameterized button-card templates `room_climate`
# and `room_light` (button_card_templates, below) instead of anchors.
#
# Action standard:
#   light chips: tap toggle, hold more-info
#   toggleable icons (fan, switch, valve): tap toggle, hold more-info
#   covers: tap script.cover_tap (moving -> stop, closed -> open, else close), hold more-info
#   room climate chips: tap more-info, hold heat <-> off
#   labels (boiler): tap more-info
#   other icons (tv, vacuums, weather, people): default (tap more-info)
#   cameras: off -> tap turns on; on -> tap more-info, hold turns off
# Covers: no `icon:` override, so HA shows the curtain/blind icon of the
# device_class and the opening/closing arrows while moving. The tap_action
# must repeat the entity id (the anchor can't reference the element's entity).
# Climate chips: translucent, no icon; current temperature, target (or "kapalı") and
# optional humidity; off/unavailable -> gray, on and heating -> red, on and idle -> green.
# Light chips: a sun-like disc in the light's color (rgb_color; warm white for lights
# without color), stronger and with a wider fading glow the higher the brightness;
# off/unavailable -> small dim gray disc, no glow.

button_card_templates:
  room_climate:
    variables:
      humidity: null
      mode: |
        [[[
          if (!entity || ['off', 'unavailable', 'unknown'].includes(entity.state)) return 'off';
          return entity.attributes.hvac_action === 'heating' ? 'heat' : 'idle';
        ]]]
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: more-info
    hold_action:
      action: perform-action
      perform_action: climate.set_hvac_mode
      target:
        entity_id: "[[[ return entity.entity_id; ]]]"
      data:
        hvac_mode: "[[[ return entity.state === 'off' ? 'heat' : 'off'; ]]]"
    custom_fields:
      temp: |
        [[[
          const t = entity.attributes.current_temperature;
          return t == null ? '–' : `${Number(t).toFixed(1)}°`;
        ]]]
      sub: |
        [[[
          const h = variables.humidity ? states[variables.humidity] : null;
          const hv = h && !isNaN(parseFloat(h.state)) ? ` · %${Math.round(parseFloat(h.state))}` : '';
          if (variables.mode === 'off') return `kapalı${hv}`;
          const tt = entity.attributes.temperature;
          return `→ ${tt == null ? '–' : tt}°${hv}`;
        ]]]
    # Translucent chip on the dark floorplan: tinted background, colored border,
    # light text shades so it stays readable over the image.
    styles:
      card:
        - width: max-content
        - padding: 3px 9px
        - border-radius: 12px
        - box-shadow: none
        - background-color: "[[[ return {heat: 'rgba(226, 75, 74, 0.22)', idle: 'rgba(99, 153, 34, 0.22)', off: 'rgba(136, 135, 128, 0.18)'}[variables.mode]; ]]]"
        - border: "[[[ return '1px solid ' + {heat: '#E24B4A', idle: '#639922', off: '#5F5E5A'}[variables.mode]; ]]]"
      grid:
        - grid-template-areas: '"temp" "sub"'
        - grid-template-columns: auto
        - justify-items: center
      custom_fields:
        temp:
          - font-size: 15px
          - font-weight: 500
          - line-height: 1.15
          - color: "[[[ return {heat: '#F7C1C1', idle: '#C0DD97', off: '#D3D1C7'}[variables.mode]; ]]]"
        sub:
          - font-size: 10px
          - line-height: 1.15
          - color: "[[[ return {heat: '#F09595', idle: '#97C459', off: '#B4B2A9'}[variables.mode]; ]]]"

  room_light:
    variables:
      # [r, g, b] of the light, or null when it is off/unavailable.
      rgb: |
        [[[
          if (!entity || entity.state !== 'on') return null;
          return entity.attributes.rgb_color || [255, 200, 120];
        ]]]
      # Brightness 0..1 (on/off-only lights count as full).
      level: |
        [[[
          if (!entity || entity.state !== 'on') return 0;
          const b = entity.attributes.brightness;
          return b == null ? 1 : Math.max(0.05, b / 255);
        ]]]
    show_name: false
    show_state: false
    show_icon: false
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    custom_fields:
      sun: ""
    styles:
      card:
        - width: 34px
        - height: 34px
        - padding: 0
        - background: none
        - border: none
        - box-shadow: none
        - overflow: visible
      grid:
        - grid-template-areas: '"sun"'
        - grid-template-columns: 1fr
        - grid-template-rows: 1fr
        - place-items: center
      custom_fields:
        sun:
          - border-radius: 50%
          - transition: all 0.4s ease
          - width: "[[[ return variables.rgb ? '16px' : '10px'; ]]]"
          - height: "[[[ return variables.rgb ? '16px' : '10px'; ]]]"
          - background-color: |
              [[[
                if (!variables.rgb) return 'rgba(136, 135, 128, 0.45)';
                const [r, g, b] = variables.rgb;
                return `rgba(${r}, ${g}, ${b}, ${(0.45 + 0.55 * variables.level).toFixed(2)})`;
              ]]]
          - border: "[[[ return variables.rgb ? 'none' : '1px solid #5F5E5A'; ]]]"
          - box-shadow: |
              [[[
                if (!variables.rgb) return 'none';
                const [r, g, b] = variables.rgb;
                const l = variables.level;
                const inner = `0 0 ${(4 + 10 * l).toFixed(1)}px ${(1 + 4 * l).toFixed(1)}px rgba(${r}, ${g}, ${b}, ${(0.35 + 0.45 * l).toFixed(2)})`;
                const outer = `0 0 ${(10 + 28 * l).toFixed(1)}px ${(3 + 10 * l).toFixed(1)}px rgba(${r}, ${g}, ${b}, ${(0.08 + 0.22 * l).toFixed(2)})`;
                return `${inner}, ${outer}`;
              ]]]

anchors:
  overlay_style: &overlay_style
    left: 50%
    top: 50%
    width: 100%
    mix-blend-mode: screen
    opacity: 50%
  filter_15: &filter_15
    "on": opacity(100%)
    "off": opacity(15%)
  filter_30: &filter_30
    "on": opacity(100%)
    "off": opacity(30%)
  filter_50: &filter_50
    "on": opacity(100%)
    "off": opacity(50%)
  overlay: &overlay
    type: image
    style: *overlay_style
    state_filter: *filter_30
  toggle_icon: &toggle_icon
    type: state-icon
    tap_action:
      action: toggle
    hold_action:
      action: more-info
  cover_icon: &cover_icon
    type: state-icon
    hold_action:
      action: more-info
  room_climate: &room_climate
    type: custom:button-card
    template: room_climate
  room_light: &room_light
    type: custom:button-card
    template: room_light
  label_font: &label_font
    font-size: 16px
    font-weight: bold
  forecast: &forecast
    type: state-icon
    entity: weather.forecast_home
    style:
      left: 90%
      top: 5%
      transform: translate(-50%, -50%) scale(2)
  sercan: &sercan
    type: state-icon
    entity: person.sercan
    style:
      left: 80%
      top: 5%
  melike: &melike
    type: state-icon
    entity: person.melike
    style:
      left: 70%
      top: 5%

