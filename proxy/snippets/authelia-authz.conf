# Authelia forward-auth endpoint (server level), added by npm_apply.py to hosts with auth = "authelia".
location /internal/authelia/authz {
    internal;
    # Through a variable: resolved per request, so NPM still starts when the auth stack is down.
    set $authelia_upstream http://authelia:9091;
    proxy_pass $authelia_upstream/api/authz/auth-request;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_http_version 1.1;
    proxy_cache_bypass $cookie_authelia_session;
    proxy_no_cache $cookie_authelia_session;
    proxy_buffers 4 32k;
    client_body_buffer_size 128k;
}
