# Lights: gungors wrappers (ha-integrations README, Features) for every light on the floor
# plans (floorplan_3d and the old 2D floorplan). Each wrapper has the light's old entity id;
# the Zigbee2MQTT original is renamed to light.<room>_lamp and hidden (dashboards and
# automations use the wrapper). `link` mirrors the original and sends commands to it; `hold`:
# gungors.hold / gungors.release.

light:
  - platform: gungors
    name: banyo_light
    unique_id: banyo_light
    features:
      - program
      - hold
      - link: light.banyo_lamp

  - platform: gungors
    name: bebek_light
    unique_id: bebek_light
    features:
      - program
      - hold
      - link: light.bebek_lamp

  - platform: gungors
    name: car_light
    unique_id: car_light
    features:
      - program
      - hold
      - link: light.car_lamp

  - platform: gungors
    name: garaj_light
    unique_id: garaj_light
    features:
      - program
      - hold
      - link: light.garaj_lamp

  - platform: gungors
    name: kaan_light
    unique_id: kaan_light
    features:
      - program
