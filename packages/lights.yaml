      - program
      - hold
      - link: light.bahce_lamp_1

  - platform: gungors
    name: bahce_light
    unique_id: bahce_light
    features:
      - hold
      - link:
          - light.bahce_light_1
          - light.bahce_light_2
          - light.bahce_light_3
