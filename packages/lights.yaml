  # mutfak: a relay (switch.yemek_2) without a light entity of its own.
  - platform: gungors
    name: mutfak_light
    unique_id: mutfak_light
    features:
      - program
      - hold
      - link: switch.yemek_2

  # bahce: the garden lamp 1 (on the floor plan by itself too) and the group of all garden
  # lights: lamp 1's wrapper, light.bahce_light_2 (a light group of the UI) and lamp 3.
  - platform: gungors
    name: bahce_light_1
    unique_id: bahce_light_1
