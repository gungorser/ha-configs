# Covers: every cover is a gungors wrapper (ha-integrations): IKEA blinds, Tuya curtains and
# the covers without a device (manual or not connected yet), which drive a position number.

# --- Covers without a device ---------------------------------------------------------
# Kitchen (mutfak) and dining (yemek) blinds, the small living room curtain (salon kucuk),
# the bathroom (banyo) curtain, the attic hall (koridor2) window curtain and the garage door:
# a position number each, 0-100 (0 closed).
# `initial` is the position after a restart or a reload of input numbers; change it here. Move
# the cover by setting the number (the floorplan_3d dashboard's configs tab) or through its
# gungors cover below; for a real device later, change the cover's `link`.
input_number:
  mutfak_cover_position:
    name: Mutfak cover position
    initial: 100 # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:roller-shade

  yemek_cover_position:
    name: Yemek cover position
    initial: 100 # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:roller-shade

  salon_kucuk_cover_position:
    name: Salon kucuk cover position
    initial: 100 # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:curtains

  banyo_cover_position:
    name: Banyo cover position
    initial: 100 # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:curtains

  koridor2_cover_position:
    name: Koridor2 cover position
    initial: 100 # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:curtains

  garaj_door_position:
    name: Garaj door position
    initial: 0   # position after a restart / reload, 0 closed - 100 open
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:garage

cover:
  # gungors covers (ha-integrations README, Features): a domain base plus a `features:` list,
  # combined in list order. `link` (always last) is the original the wrapper drives; dashboards
  # and automations use the wrapper, never the original.

  # --- Covers without a device ---------------------------------------------------------
  # Linked to their position number above; moving the cover sets the number.
  - platform: gungors
    name: mutfak_cover
    unique_id: mutfak_cover
    device_class: shade
    features:
      - link: input_number.mutfak_cover_position

  - platform: gungors
    name: yemek_cover
    unique_id: yemek_cover
    device_class: shade
    features:
      - link: input_number.yemek_cover_position

  - platform: gungors
    name: salon_kucuk_cover
    unique_id: salon_kucuk_cover
    device_class: curtain
    features:
      - link: input_number.salon_kucuk_cover_position

  - platform: gungors
    name: banyo_cover
    unique_id: banyo_cover
    device_class: curtain
    features:
      - link: input_number.banyo_cover_position

  - platform: gungors
    name: koridor2_cover
    unique_id: koridor2_cover
    device_class: curtain
    features:
      - link: input_number.koridor2_cover_position

  - platform: gungors
    name: garaj_door
    unique_id: garaj_door
    device_class: garage
    features:
      - link: input_number.garaj_door_position

  # --- IKEA blinds -------------------------------------------------------------------
  # direction: movement tracking (opening/closing, real position while moving).
  # window: remote commands are held while the window is open. buttons: the pushbutton
  # blueprint sends wall button presses as physical requests (allowed with the window open).
  # hold: gungors.hold / gungors.release.
  - platform: gungors
    name: sercan_cover
    unique_id: sercan_cover
    device_class: blind
    features:
      - hold
      - buttons
      - window: binary_sensor.sercan_window_contact
      - direction
      - link: cover.sercan_blind

  - platform: gungors
    name: bebek_cover
    unique_id: bebek_cover
    device_class: blind
    features:
      - hold
      - buttons
      - window: binary_sensor.bebek_window_contact
      - direction
      - link: cover.bebek_blind

  - platform: gungors
    name: yatak_cover_window
    unique_id: yatak_cover_window
    device_class: blind
    features:
      - hold
      - buttons
      - window: binary_sensor.yatak_window_contact
      - direction
      - link: cover.yatak_blind_2

  # No window sensor: nothing to guard.
  - platform: gungors
    name: koridor1_cover
    unique_id: koridor1_cover
    device_class: blind
    features:
      - hold
      - buttons
      - direction
      - link: cover.koridor1_blind

  # Yatak: the two blinds without a window contact, and the group of all three.
  - platform: gungors
    name: yatak_cover_1
    unique_id: yatak_cover_1
    device_class: blind
    features:
      - hold
      - direction
      - link: cover.yatak_blind_1

  - platform: gungors
    name: yatak_cover_3
    unique_id: yatak_cover_3
    device_class: blind
    features:
      - hold
      - direction
      - link: cover.yatak_blind_3

  - platform: gungors
    name: yatak_cover
    unique_id: yatak_cover
    device_class: blind
    features:
      - hold
      - link:
          - cover.yatak_cover_window
          - cover.yatak_cover_1
          - cover.yatak_cover_3

  # --- Tuya curtains -----------------------------------------------------------------
  # travel_time: the motors report no position while moving; the wrapper estimates it from
  # learned full-run times (open_time / close_time) and takes the real position from stop /
  # end-of-move reports. invert: the motor's open is the room's close (Z2M's invert_cover
  # only flips positions for this device, so it is left as it was).
  - platform: gungors
    name: salon_cover
    unique_id: salon_cover
    device_class: curtain
    features:
      - hold
      - invert
      - travel_time
      - link: cover.salon_curtain

  - platform: gungors
    name: misafir_cover
    unique_id: misafir_cover
    device_class: curtain
    features:
      - hold
      - invert
      - travel_time
      - link: cover.misafir_curtain

script:
  # Single-tap behaviour for covers on dashboards (used by floorplan.yaml).
  # Unlike cover.toggle it does not depend on the last move's direction:
  # moving -> stop, closed -> open, anything else (open or partly open) -> close.
  cover_tap:
    alias: cover_tap
    description: Stop if moving, open if closed, otherwise close
    mode: parallel
    max: 20
    fields:
      cover:
        description: Cover entity id
    sequence:
      - choose:
          - conditions: "{{ states(cover) in ['opening', 'closing'] }}"
            sequence:
              - action: cover.stop_cover
                target:
                  entity_id: "{{ cover }}"
          - conditions: "{{ is_state(cover, 'closed') }}"
            sequence:
              - action: cover.open_cover
                target:
                  entity_id: "{{ cover }}"
        default:
          - action: cover.close_cover
            target:
              entity_id: "{{ cover }}"
