lovelace:
  mode: storage
  resources:
    - url: /local/community/scheduler-card/scheduler-card.js
      type: module
    - url: /local/community/ha-floorplan/floorplan.js
      type: module
  dashboards:
    roomstate-dashboard:
      mode: yaml
      title: Gereksiz
      icon: mdi:power
      show_in_sidebar: true
      filename: gungors/dashboards/unnecessary.yaml
    floorplan-dashboard:
      mode: yaml
      title: Floorplan
      icon: mdi:floor-plan
      show_in_sidebar: true
      filename: gungors/dashboards/floorplan.yaml
    program-dashboard:
      mode: yaml
      title: Program
      icon: mdi:calendar-clock
      show_in_sidebar: true
      filename: gungors/dashboards/program.yaml
    floorplan3d-dashboard:
      mode: yaml
      title: Floorplan 3D
      icon: mdi:home-lightbulb
      show_in_sidebar: true
      filename: gungors/dashboards/floorplan_3d.yaml

# Floorplan 3D: opacity of the robot vacuum's map on the kat0 floor (floorplan_3d.yaml vacuum_opacity),
# set on its configs tab; no initial, so it keeps its value over restarts.
input_number:
  vacuum_map_opacity:
    name: Vacuum map opacity
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: mdi:robot-vacuum

# Floorplan 3D: the car on the kat0 driveway (card show.araba) follows whether a car is parked in
# our spot. The doorbell camera's top view looks along the driveway: our spot is in its middle,
# straight ahead; the car on the right under the roof is the neighbours'. The picture goes to the
# Google AI task, which answers yes or no. The doorbell runs on a battery, so its picture is the last
# one it took. Its motion sensor stays off; an event shows as a new image.doorbell_event_image, so
# the check runs 5 minutes after the last event, every hour, at start and after a template reload.
# A failed or unclear answer keeps the last state.
template:
  - triggers:
      - trigger: state
        entity_id: image.doorbell_event_image
        for: "00:05:00"
      - trigger: time_pattern
        minutes: 0
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    actions:
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          task_name: floorplan araba
          entity_id: ai_task.google_ai_task
          instructions: >-
            Doorbell camera picture: two views stacked. Look only at the top view, which looks
            along the driveway. Our parking spot is in the middle of the top view, straight ahead
            from the camera, left of the covered parking place on the right. The car on the right
            under the roof is the neighbour's: ignore it. Is a car parked in our spot in the middle?
            Answer present true or false.
          structure:
            present:
              description: true if a car is parked in our spot in the middle of the top view
              required: true
              selector:
                boolean:
          attachments:
            - media_content_id: media-source://camera/camera.doorbell
              media_content_type: image/jpeg
        response_variable: result
    binary_sensor:
      - name: Floorplan araba
        unique_id: floorplan_araba
        icon: mdi:car-hatchback
        state: >-
          {% if result is defined and result.data is mapping and result.data.present is boolean %}
            {{ result.data.present }}
          {% else %}
            {{ this.state == 'on' }}
          {% endif %}
