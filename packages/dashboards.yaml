lovelace:
  mode: storage
  resources:
    - url: /local/community/scheduler-card/scheduler-card.js
      type: module
    - url: /local/community/ha-floorplan/floorplan.js
      type: module
  dashboards:
    roomstate-dashboard:
      mode: yaml
      title: Gereksiz
      icon: mdi:power
      show_in_sidebar: true
      filename: gungors/dashboards/unnecessary.yaml
    floorplan-dashboard:
      mode: yaml
      title: Floorplan
      icon: mdi:floor-plan
      show_in_sidebar: true
      filename: gungors/dashboards/floorplan.yaml
    program-dashboard:
      mode: yaml
      title: Program
      icon: mdi:calendar-clock
      show_in_sidebar: true
      filename: gungors/dashboards/program.yaml
    floorplan3d-dashboard:
      mode: yaml
      title: Floorplan 3D
      icon: mdi:home-lightbulb
      show_in_sidebar: true
      filename: gungors/dashboards/floorplan_3d.yaml

# Floorplan 3D: the car on the kat0 driveway (card show.araba) follows whether a car is parked in
# our spot. The doorbell camera's top view looks along the driveway: our spot is its foreground, in
# front of the door; the cars further away (middle, right under the roof) are the neighbours'. The
# picture goes to the Google AI task, which answers yes or no. The doorbell runs on a battery, so its
# picture is the last one it took (on motion or a live view): checked when its motion clears and
# every 15 minutes. A failed or unclear answer keeps the last state.
template:
  - triggers:
      - trigger: motion.cleared
        target:
          entity_id: binary_sensor.doorbell_motion_detected
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    actions:
      - action: ai_task.generate_data
        continue_on_error: true
        data:
          task_name: floorplan araba
          entity_id: ai_task.google_ai_task
          instructions: >-
            Doorbell camera picture: two views stacked. Look only at the top view, which looks
            along the driveway. Our parking spot is the paved area in the foreground of the top
            view, the part closest to the camera, in front of our door. Cars further away (in the
            middle of the picture or on the right under the roof) are the neighbours' and do not
            count. Is a car parked in our spot in the foreground? Answer present true or false.
          structure:
            present:
              description: true if a car is parked in our spot in the foreground of the top view
              required: true
              selector:
                boolean:
          attachments:
            - media_content_id: media-source://camera/camera.doorbell
              media_content_type: image/jpeg
        response_variable: result
    binary_sensor:
      - name: Floorplan araba
        unique_id: floorplan_araba
        icon: mdi:car-hatchback
        state: >-
          {% if result is defined and result.data is mapping and result.data.present is boolean %}
            {{ result.data.present }}
          {% else %}
            {{ this.state == 'on' }}
          {% endif %}
