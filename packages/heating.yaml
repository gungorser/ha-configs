# Heating: gungors thermostats (climate), the heating demand sensor and
# the boiler relay automation. Previously split over thermostats/climates.yaml and
# thermostats/switch_automation.yaml.

climate:
  # gungors thermostats (ha-integrations README, Features). TRV rooms: the PID turns the room
  # temperature into a demand 0-100, `valve` maps it onto the TRV valve opening/closing degree
  # (min = minimum opening %), `link` keeps the wrapper and the TRV in two-way sync (the
  # wrapper is unavailable while the TRV is; the TRV's min_temp is used). `hold`:
  # gungors.hold / gungors.release. force_off: false keeps SmartThermostat's old
  # force_off_state: false.

  - platform: gungors
    name: sercan_thermostat
    unique_id: sercan_thermostat
    target_temp: 19
    max_temp: 35
    features:
      - hold
      - pid:
          kp: 16
          ki: 0.01
          kd: 4
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - valve:
          opening: number.sercan_climate_valve_opening_degree
          closing: number.sercan_climate_valve_closing_degree
          min: 10
      - temperature: sensor.sercan_sensor_temperature
      - link:
          entity: climate.sercan_climate
          cooldown_time: 1

  - platform: gungors
    name: misafir_thermostat
    unique_id: misafir_thermostat
    target_temp: 19
    max_temp: 35
    features:
      - hold
      - pid:
          kp: 90
          ki: 0.08
          kd: 80
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - valve:
          opening: number.misafir_climate_valve_opening_degree
          closing: number.misafir_climate_valve_closing_degree
      - temperature: sensor.misafir_sensor_temperature
      - link:
          entity: climate.misafir_climate
          cooldown_time: 1

  # NOTE: the bebek TRV (climate.bebek_climate) is currently disconnected, so
  # bebek_thermostat stays unavailable until it is back.
  - platform: gungors
    name: bebek_thermostat
    unique_id: bebek_thermostat
    target_temp: 19
    max_temp: 35
    features:
      - hold
      - pid:
          kp: 30
          ki: 0.06
          kd: 80
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - valve:
          opening: number.bebek_climate_valve_opening_degree
          closing: number.bebek_climate_valve_closing_degree
      - temperature: sensor.bebek_sensor_temperature
      - link:
          entity: climate.bebek_climate
          cooldown_time: 1

  - platform: gungors
    name: melike_thermostat
    unique_id: melike_thermostat
    target_temp: 19
    max_temp: 35
    features:
      - hold
      - pid:
          kp: 40
          ki: 0.02
          kd: 60
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - valve:
          opening: number.melike_climate_valve_opening_degree
          closing: number.melike_climate_valve_closing_degree
      - temperature: sensor.melike_sensor_temperature
      - link:
          entity: climate.melike_climate
          cooldown_time: 1

  - platform: gungors
    name: banyo_thermostat
    unique_id: banyo_thermostat
    target_temp: 19
    max_temp: 35
    features:
      - hold
      - pid:
          kp: 50
          ki: 0.02
          kd: 60
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - valve:
          opening: number.banyo_climate_valve_opening_degree
          closing: number.banyo_climate_valve_closing_degree
      - temperature: sensor.banyo_moisture_temperature
      - link:
          entity: climate.banyo_climate
          cooldown_time: 1

  - platform: gungors
    name: yatak_thermostat
    unique_id: yatak_thermostat
    target_temp: 19
    max_temp: 35
    features:
      - hold
      - pid:
          kp: 40
          ki: 0.05
          kd: 60
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - valve:
          opening: number.yatak_climate_valve_opening_degree
          closing: number.yatak_climate_valve_closing_degree
          min: 10
      - temperature: sensor.yatak_sensor_temperature
      - link:
          entity: climate.yatak_climate
          cooldown_time: 1

  # salon: the boiler circuit thermostat (EMS-ESP hc1) and a socket heater driven by PWM.
  - platform: gungors
    name: salon_thermostat
    unique_id: salon_thermostat
    target_temp: 19
    max_temp: 35
    features:
      - hold
      - pid:
          kp: 150
          ki: 0
          kd: 0
          keep_alive: {minutes: 15}
          force_off: false
          debug: true
      - pwm:
          entity: switch.koridor0_socket
          period: "00:15:00"
          min_cycle_duration: 60
      - temperature: sensor.thermostat_hc1_currtemp
      - link:
          entity: climate.thermostat_hc1
          cooldown_time: 1

template:
  # Heating demand: on while at least one thermostat reports hvac_action heating.
  # Unavailable thermostats (e.g. one whose TRV dropped) don't count.
  - binary_sensor:
      - name: kombi_talebi
        unique_id: kombi_talebi
        icon: mdi:fire
        state: >-
          {{ ['climate.sercan_thermostat',
              'climate.yatak_thermostat',
              'climate.melike_thermostat',
              'climate.bebek_thermostat',
              'climate.banyo_thermostat',
              'climate.misafir_thermostat',
              'climate.salon_thermostat']
             | select('is_state_attr', 'hvac_action', 'heating')
             | list | count > 0 }}

automation:
  # Mirrors binary_sensor.kombi_talebi onto the (hidden) boiler relay. Also resyncs
  # at startup and whenever the relay reports on/off (manual change, or back from
  # unavailable). While the relay is unavailable nothing is sent.
  - alias: thermostat_switch
    id: thermostat_switch
    description: ""
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.kombi_talebi
      - trigger: state
        entity_id: switch.koridor2_switch
        to: ["on", "off"]
      - trigger: homeassistant
        event: start
    conditions: []
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.kombi_talebi
                state: "on"
              - condition: state
                entity_id: switch.koridor2_switch
                state: "off"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.koridor2_switch
          - conditions:
              - condition: state
                entity_id: binary_sensor.kombi_talebi
                state: "off"
              - condition: state
                entity_id: switch.koridor2_switch
                state: "on"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.koridor2_switch
