# Programs: calendar.program from gungors (ha-integrations README, Programs).
# Each calendar entry is a program: a target (areas, entities) and rules that the entities
# with the `program` feature follow while it runs (lights, thermostats, covers). The program
# card on the `program` dashboard edits the entries. Replaces schedules.yaml (the three
# person calendars and the climate_schedule / cover_schedule automations).
#
# Defaults (what a device returns to when a set rule ends; covers also at sunrise and
# sunset) are edited in the program card's Varsayılanlar tab and kept by gungors
# (gungors.set_program_defaults); the built-in ones are light off and white, heating off,
# covers by the sun. A wrapper can override them with `- program: {<attribute>: <value>}`.

calendar:
  - platform: gungors
    name: program
