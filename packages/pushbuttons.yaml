# Pushbuttons: gungors wrappers (ha-integrations README, Pushbuttons) for the Moes scene
# remotes on Zigbee2MQTT. Each wrapper links the device's Z2M event entity
# (event.<device>_action; Z2M's Home Assistant option for event entities must be on) and acts
# on its presses. Targets are the device's area unless a `target` is given.
#
# Location rule: `keys` is how many keys the device has, `door` the side of the door it is on
# (Moes key 1 is the leftmost). light goes on the key nearest the door, cover on the farthest,
# and on the middle key of a three-key device climate (single), program (double) and custom
# (hold). A function's `button` overrides its key (two-key devices have no middle key; without
# `door` every function gives one), its `target` the target.
#
# - light: single off / on (default preset); double brightness dim <-> default; hold colour
#   night <-> default (presets.yaml).
# - climate: toggles (lights blink once: green on, blue off).
# - program: starts / stops a timeless program (two blinks).
# - cover: single open, double close (physical: also with the window open), a press while it
#   moves stops it; hold closes the whole floor with a backup scene, or restores it.
# - A press a program rule limits is applied as the rule allows; the lights blink red twice.

event:
  # No door at the garden: the light names its key.
  - platform: gungors
    name: bahce_pushbutton
    unique_id: bahce_pushbutton
    keys: 2
    features:
      - buttons:
          - light: {button: 1}
      - link: event.bahce_pushbutton_action

  - platform: gungors
    name: garaj_pushbutton
    unique_id: garaj_pushbutton
    keys: 1
    features:
      - buttons:
          - light
      - link: event.gardirop_pushbutton_action

  # Three keys although Z2M's model says two.
  - platform: gungors
    name: koridor0_pushbutton
    unique_id: koridor0_pushbutton
    keys: 3
    door: right
    features:
      - buttons:
          - light                                          # 3: koridor0
          - light: {button: 2, target: {area_id: araba}}   # 2: araba
          - light: {button: 1, target: {area_id: garaj}}   # 1: garaj
      - link: event.koridor0_pushbutton_action

  - platform: gungors
    name: koridor1_pushbutton
    unique_id: koridor1_pushbutton
    keys: 2
    door: left
    features:
      - buttons:
          - light
          - cover
      - link: event.koridor1_pushbutton_action

  - platform: gungors
    name: koridor2_pushbutton
    unique_id: koridor2_pushbutton
    keys: 2
    door: left
    features:
      - buttons:
          - light
          - light: {button: 2, target: {entity_id: light.tavan_light_2}}
      - link: event.koridor2_pushbutton_action

  - platform: gungors
    name: melike_pushbutton
    unique_id: melike_pushbutton
    keys: 2
    door: left
    features:
      - buttons:
          - light
          - climate: {button: 2}
      - link: event.melike_pushbutton_action

  - platform: gungors
    name: bebek_pushbutton
    unique_id: bebek_pushbutton
    keys: 3
    door: right
    features:
      - buttons:
          - light
          - cover
          - climate
          - program: "Kaan gündüz uyku"
      - link: event.bebek_pushbutton_action

  - platform: gungors
    name: sercan_pushbutton
    unique_id: sercan_pushbutton
    keys: 3
    door: left
    features:
      - buttons:
          - light
          - cover
          - climate
          - custom:  # the monitors' outlet
              action: switch.toggle
              target: {entity_id: switch.sercan_plug}
      - link: event.sercan_pushbutton_action

  - platform: gungors
    name: yatak_pushbutton
    unique_id: yatak_pushbutton
    keys: 3
    door: right
    features:
      - buttons:
          - light
          - cover
          - climate
      - link: event.yatak_pushbutton_action

  - platform: gungors
    name: misafir_pushbutton
    unique_id: misafir_pushbutton
    keys: 3
    door: right
    features:
      - buttons:
          - light
          - cover
          - climate
      - link: event.misafir_pushbutton_action
