# Pushbuttons: gungors wrappers (ha-integrations README, Pushbuttons) for the Moes scene
# remotes on Zigbee2MQTT. Each wrapper links the device's Z2M event entity
# (event.<device>_action; Z2M's Home Assistant option for event entities must be on) and acts
# on its presses. Targets are the device's area unless a `target` is given.
#
# Slots are <button>_<gesture> (single, double, hold). `light` and `cover` take all three of
# their button, `climate` the single press (and the double press with a `program`). `custom`
# actions go on free slots only.
#
# - light: single off / on (default preset); double brightness dim <-> default; hold colour
#   night <-> default (presets.yaml).
# - climate: single toggles (lights blink once: green on, blue off); with
#   `climate: {program: "<timeless program>"}` double starts / stops it (two blinks).
# - cover: single open, double close (physical: also with the window open); hold closes the
#   whole floor with a backup scene, or restores it.
# - A press a program rule limits is applied as the rule allows; the lights blink red twice.

event:
  - platform: gungors
    name: bahce_pushbutton
    unique_id: bahce_pushbutton
    features:
      - buttons:
          1: light
      - link: event.bahce_pushbutton_action

  - platform: gungors
    name: garaj_pushbutton
    unique_id: garaj_pushbutton
    features:
      - buttons:
          1: light
      - link: event.gardirop_pushbutton_action

  - platform: gungors
    name: koridor0_pushbutton
    unique_id: koridor0_pushbutton
    features:
      - buttons:
          2: light
      - custom:
          1_single:
            action: light.toggle
            target: {entity_id: light.araba_light}
      - link: event.koridor0_pushbutton_action

  - platform: gungors
    name: koridor1_pushbutton
    unique_id: koridor1_pushbutton
    features:
      - buttons:
          1: light
          2: cover
      - link: event.koridor1_pushbutton_action

  - platform: gungors
    name: koridor2_pushbutton
    unique_id: koridor2_pushbutton
    features:
      - buttons:
          1: light
      - custom:
          2_single:
            action: light.toggle
            target: {entity_id: light.tavan_light_2}
      - link: event.koridor2_pushbutton_action

  - platform: gungors
    name: melike_pushbutton
    unique_id: melike_pushbutton
    features:
      - buttons:
          1: light
          2: climate
      - link: event.melike_pushbutton_action

  - platform: gungors
    name: bebek_pushbutton
    unique_id: bebek_pushbutton
    features:
      - buttons:
          1: cover
          2: climate
          3: light
      - link: event.bebek_pushbutton_action

  - platform: gungors
    name: sercan_pushbutton
    unique_id: sercan_pushbutton
    features:
      - buttons:
          1: light
          2: climate
          3: cover
      - custom:
          2_hold:  # the monitors' outlet
            action: switch.toggle
            target: {entity_id: switch.sercan_plug}
      - link: event.sercan_pushbutton_action

  - platform: gungors
    name: yatak_pushbutton
    unique_id: yatak_pushbutton
    features:
      - buttons:
          1: cover
          2: climate
          3: light
      - link: event.yatak_pushbutton_action

  - platform: gungors
    name: misafir_pushbutton
    unique_id: misafir_pushbutton
    features:
      - buttons:
          1: cover
          2: climate
          3: light
      - link: event.misafir_pushbutton_action
