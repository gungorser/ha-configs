# Floorplan 3D dashboard: live-lit Blender renders of each floor (custom:gungors-floor-card from
# the ha-dashboards HACS repository). The page (index.html) and the render of each floor are build
# output of the ha-floorplan project, deployed to /config/www/gungors_floor/.
# The page draws; here its entities are mapped to Home Assistant entities and their actions are set.
# The time comes from Home Assistant's time zone, the day (sunrise, sunset) from sun.
# Nothing happens by default: every tap/hold is written here.
#
# Action standard (same as floorplan.yaml):
#   lights: tap toggle, hold more-info
#   rooms (climate) and objects (tv, vacuum): tap and hold more-info
#   covers: tap script.cover_tap (moving -> stop, closed -> open, else close), hold more-info
#   garaj_door (garage door), yemek_blind (garden door), mutfak_blind (kitchen window),
#   salon_kucuk_cover (small curtain, salon's east window), kat1 banyo_cover (bathroom window
#   curtain), kat2 koridor2_cover (attic hall window curtain) and melike_cover (curtain of melike's
#   roof window) have no device: template covers
#   on a position number (packages/covers.yaml, initial position at its top; the configs tab sets
#   them). They are manual: selectable: false (card 1.14), background like none, but the picture
#   follows their position.
# A page entity left out of the list shows up on the page (top right) with its name: map it or set none.
# All floors are in one card (floors:); the floor button of the card's dock goes on to the next floor.
# Kat1: balkon_light is the balcony lamp; the bedroom (yatak) has three blinds: north window, balcony door, east window.
#   A tap or hold on any of the three goes to their group cover.yatak_cover; each shows its own position.
# Kat2 (attic): the lamps, covers and climates of the old floorplan's kat2 view; misafir_light hangs on the
#   wall over the guest room's door, tavan_light (light.tavan_light_2) lights the top of the wardrobes.
# Climates are the rooms' radiators (kat1, kat2).
#
# Lighting of the house (no render needed): `lighting.default` everywhere, also at night; while the sun
# is up each room of a floor (`rooms`, the zones of its render) adds its `sun` and `covers` x how far
# its covers are open (their mean); a room left out: sun 1, covers 2. `other` = what is
# in no room (rooms without covers, the outside). E.g. default 0.15, sun 1, covers 2: day open 3.15, day closed 1.15,
# night 0.15. A light's `gain`: its brightness at full intensity, times the render's.

views:
  - title: Floorplan
    path: floorplan
    type: panel
    cards:
      - type: custom:gungors-floor-card
        sun: sun.sun
        lighting:
          default: 0.15
        floors:
          - floor: kat0
            rooms:
              salon: {sun: 1, covers: 2}
              garaj: {sun: 1, covers: 2}
              koridor0: {sun: 0.7, covers: 1.4}             # the hallway 30% darker by day
              other: {sun: 3}
            entities:
              # covers
              salon_cover:
                entity: cover.salon_cover
                tap_action:
                  action: perform-action
                  perform_action: script.cover_tap
                  data:
                    cover: cover.salon_cover
                hold_action:
                  action: more-info
              garaj_door:             # garage door (manual: follows its position, not selectable)
                entity: cover.garaj_door
                selectable: false
              yemek_blind:            # garden door (manual: follows its position, not selectable)
                entity: cover.yemek_cover
                selectable: false
              mutfak_blind:           # kitchen window (manual: follows its position, not selectable)
                entity: cover.mutfak_cover
                selectable: false
              salon_kucuk_cover:      # small curtain, salon's east window (manual: follows its position, not selectable)
                entity: cover.salon_kucuk_cover
                selectable: false
              # underfloor heating (climate): every room but the garage, below lamps and covers
              salon_climate: &climate
                entity: climate.salon_thermostat
                tap_action:
                  action: more-info
                hold_action:
                  action: more-info
              # objects: tap and hold more-info (like their icons on floorplan.yaml)
              salon_tv: &object
                entity: media_player.salon_tv
                tap_action:
                  action: more-info
                hold_action:
                  action: more-info
              salon_vacuum:
                <<: *object
                entity: vacuum.xiaomi_c102gl_9267_robot_cleaner
              # lights
              garaj_light: &light
                entity: light.garaj_light
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              salon_light:
                <<: *light
                entity: light.salon_light
                gain: 2                       # twice as bright as the render
              koridor0_light:
                <<: *light
                entity: light.koridor0_light
              mutfak_light:
                <<: *light
                entity: light.mutfak_light
              yemek_light:
                <<: *light
                entity: light.yemek_light
              car_light:
                <<: *light
                entity: light.car_light
              bahce_light_1:
                <<: *light
                entity: light.bahce_light_1
              bahce_light:
                <<: *light
                entity: light.bahce_light
          - floor: kat1
            rooms:
              sercan: {sun: 1, covers: 2}
              bebek: {sun: 1, covers: 2}
              yatak: {sun: 1, covers: 2}                    # three blinds: their mean
              koridor1: {sun: 1, covers: 2}
              banyo: {sun: 1, covers: 2}                    # the window curtain (banyo_cover)
              other: {sun: 3}
            entities:
              # covers (blinds cover the whole window: both panes and the top-hung sash)
              bebek_blind:
                entity: cover.bebek_cover
                tap_action:
                  action: perform-action
                  perform_action: script.cover_tap
                  data:
                    cover: cover.bebek_cover
                hold_action:
                  action: more-info
              sercan_blind:
                entity: cover.sercan_cover
                tap_action:
                  action: perform-action
                  perform_action: script.cover_tap
                  data:
                    cover: cover.sercan_cover
                hold_action:
                  action: more-info
              koridor1_blind:
                entity: cover.koridor1_cover
                tap_action:
                  action: perform-action
                  perform_action: script.cover_tap
                  data:
                    cover: cover.koridor1_cover
                hold_action:
                  action: more-info
              yatak_blind_pencere:            # north window
                entity: cover.yatak_blind_1
                <<: &yatak_blind              # all three command the group cover.yatak_cover; position from its own blind
                  tap_action:
                    action: perform-action
                    perform_action: script.cover_tap
                    data:
                      cover: cover.yatak_cover
                  hold_action:
                    action: more-info
                    entity: cover.yatak_cover
              yatak_blind_kapi:               # balcony door
                entity: cover.yatak_blind_3
                <<: *yatak_blind
              yatak_blind_dogu:               # east window (window contact: guarded)
                entity: cover.yatak_cover_window
                <<: *yatak_blind
              banyo_cover:                    # bathroom window curtain (manual: follows its position, not selectable)
                entity: cover.banyo_cover
                selectable: false
              # radiators (climate: the room's thermostat)
              bebek_climate:
                <<: *climate
                entity: climate.bebek_thermostat
              yatak_climate:
                <<: *climate
                entity: climate.yatak_thermostat
              sercan_climate:
                <<: *climate
                entity: climate.sercan_thermostat
              banyo_climate:                  # the towel radiator
                <<: *climate
                entity: climate.banyo_thermostat
              # lights
              yatak_light:
                <<: *light
                entity: light.yatak_light
              bebek_light:
                <<: *light
                entity: light.bebek_light
              sercan_light:
                <<: *light
                entity: light.sercan_light
              banyo_light:
                <<: *light
                entity: light.banyo_light
              koridor1_light:
                <<: *light
                entity: light.koridor1_light
              balkon_light:           # the balcony lamp (Home Assistant still calls it kaan_light)
                <<: *light
                entity: light.kaan_light
          - floor: kat2
            rooms:
              misafir: {sun: 1, covers: 2}                  # the whole guest room, up to where its slope meets the walls
              melike: {sun: 0, covers: 3}                   # light only through the roof window: dark when its curtain is closed
              cati_arasi: {sun: 0, covers: 0}               # behind the knee wall: only default
              other: {sun: 3}
            entities:
              # covers: the guest room's dormer curtain, the hall window's curtain, melike's roof window curtain
              misafir_cover:
                entity: cover.misafir_cover
                tap_action:
                  action: perform-action
                  perform_action: script.cover_tap
                  data:
                    cover: cover.misafir_cover
                hold_action:
                  action: more-info
              koridor2_cover:                 # attic hall window curtain (manual: follows its position, not selectable)
                entity: cover.koridor2_cover
                selectable: false
              melike_cover:                   # melike's roof window curtain (manual: follows its position, not selectable)
                entity: cover.melike_cover
                selectable: false
              # radiators (climate: the room's thermostat)
              misafir_climate:
                <<: *climate
                entity: climate.misafir_thermostat
              melike_climate:
                <<: *climate
                entity: climate.melike_thermostat
              # lights
              misafir_light:                  # on the wall over the door
                <<: *light
                entity: light.misafir_light
              melike_light:
                <<: *light
                entity: light.melike_light
              koridor2_light:
                <<: *light
                entity: light.koridor2_light
              tavan_light:                    # over the wardrobes
                <<: *light
                entity: light.tavan_light_2
  # Positions of the covers without a device (input numbers in packages/covers.yaml; their
  # initial value after a restart is set there)
  - title: configs
    path: configs
    cards:
      - type: entities
        title: Cover positions
        entities:
          - entity: input_number.mutfak_cover_position
            name: Mutfak blind
          - entity: input_number.yemek_cover_position
            name: Yemek blind
          - entity: input_number.salon_kucuk_cover_position
            name: Salon kucuk perde
          - entity: input_number.banyo_cover_position
            name: Banyo perde
          - entity: input_number.koridor2_cover_position
            name: Koridor2 perde
          - entity: input_number.melike_cover_position
            name: Melike cati penceresi perde
          - entity: input_number.garaj_door_position
            name: Garaj kapisi
