# Floorplan 3D dashboard: live-lit Blender renders of each floor (custom:gungors-floor-card from
# the ha-dashboards HACS repository). The page (index.html) and the render of each floor are build
# output of the ha-floorplan project, deployed to /config/www/gungors_floor/.
# The page draws; here its entities are mapped to Home Assistant entities and their actions are set.
# The time comes from Home Assistant's time zone, the day (sunrise, sunset) from sun.
# Nothing happens by default: every tap/hold is written here.
#
# Action standard (same as floorplan.yaml):
#   lights: tap toggle, hold more-info
#   rooms (climate) and objects (tv, vacuum): tap and hold more-info
#   climates: name and humidity (a sensor) show in the card's heating mode (one room per press of
#   its heating button; the screen runs the room's tap / hold)
#   bins (cop_kutulari): tap opens a popup with the Afvalwijzer collection dates, hold more-info
#   garden irrigation (bahce_sulama, the back lawn): tap toggle, hold more-info; watering effect while open
#   cameras (bahce_kamera, kapi_kamera; card 1.23): tap live view popup (action camera), hold more-info;
#   the card's camera mode lists them one at a time
#   covers: tap script.cover_tap (moving -> stop, closed -> open, else close), hold more-info
#   garaj_door (garage door), yemek_blind (garden door), mutfak_blind (kitchen window),
#   salon_kucuk_cover (small curtain, salon's east window), kat1 banyo_cover (bathroom window
#   blind), kat2 koridor2_cover (attic hall window blind) and melike_cover (blind of melike's
#   roof window) have no device: gungors covers
#   linked to a position number (packages/covers.yaml, initial position at its top; the configs tab sets
#   them). They are manual: selectable: false (card 1.14), background like none, but the picture
#   follows their position.
# Decor (card 1.25 show, ha-floorplan config decor): kat0 araba, the car on the driveway, follows
#   input_boolean.floorplan_araba (packages/dashboards.yaml), switched on the configs tab.
# A page entity left out of the list shows up on the page (top right) with its name: map it or set none.
# All floors are in one card (floors:); the floor button of the card's dock goes on to the next floor.
# Kat1: balkon_light is the balcony lamp; the bedroom (yatak) has three blinds: north window, balcony door, east window.
#   A tap or hold on any of the three goes to their group cover.yatak_cover; each shows its own position.
# Kat2 (attic): the lamps, covers and climates of the old floorplan's kat2 view; misafir_light hangs on the
#   wall over the guest room's door.
#   melike_dolap_kapi / misafir_dolap_kapi: the wardrobes' sliding doors, gungors covers on a position
#   number like the manual covers above (configs tab), not selectable.
# Kat3 (the attic over kat2, under the roof): tavan_light (light.tavan_light_2) on the sloped ceiling.
# Climates are the rooms' radiators (kat1, kat2).
#
# Lighting of the house (no render needed): `lighting.default` everywhere, also at night; while the sun
# is up each room of a floor (`rooms`, the zones of its render) adds its `sun` and `covers` x how far
# its covers are open (their mean); a room left out: sun 1, covers 2. `other` = what is
# in no room (rooms without covers, the outside). E.g. default 0.15, sun 1, covers 2: day open 3.15, day closed 1.15,
# night 0.15. A light's `gain`: its brightness at full intensity, times the render's.

views:
  - title: Floorplan
    path: floorplan
    type: panel
    cards:
      - type: custom:gungors-floor-card
        sun: sun.sun
        lighting:
          default: 0.15
        floors:
          - floor: kat0
            rooms:
              salon: {sun: 1, covers: 2}
              garaj: {sun: 1, covers: 2}
              koridor0: {sun: 0.7, covers: 1.4}             # the hallway 30% darker by day
              other: {sun: 3}
            show:                             # decor of the render (card 1.25): the car on the driveway,
              araba: input_boolean.floorplan_araba   #   shown while the configs tab's switch is on
            entities:
              # covers
              salon_cover:
                entity: cover.salon_cover
                tap_action:
                  action: perform-action
                  perform_action: script.cover_tap
                  data:
                    cover: cover.salon_cover
                hold_action:
                  action: more-info
              garaj_door:             # garage door (manual: follows its position, not selectable)
                entity: cover.garaj_door
                selectable: false
              yemek_blind:            # garden door (manual: follows its position, not selectable)
                entity: cover.yemek_cover
                selectable: false
              mutfak_blind:           # kitchen window (manual: follows its position, not selectable)
                entity: cover.mutfak_cover
                selectable: false
              salon_kucuk_cover:      # small curtain, salon's east window (manual: follows its position, not selectable)
                entity: cover.salon_kucuk_cover
                selectable: false
              # underfloor heating (climate): every room but the garage, below lamps and covers
              salon_climate: &climate
                entity: climate.salon_thermostat
                name: Salon
                tap_action:
                  action: more-info
                hold_action:
                  action: more-info
              # objects: tap and hold more-info (like their icons on floorplan.yaml)
              salon_tv: &object
                entity: media_player.salon_tv
                tap_action:
                  action: more-info
                hold_action:
                  action: more-info
              salon_vacuum:
                <<: *object
                entity: vacuum.xiaomi_c102gl_9267_robot_cleaner
              cop_kutulari:           # the bins beside the driveway: tap opens the Afvalwijzer collection
                entity: sensor.afvalwijzer_5685js_17_next_date   # window (card 1.18 popup), hold more-info
                tap_action:
                  action: popup
                  title: Çöp takvimi
                  card:
                    type: vertical-stack
                    cards:
                      - type: markdown
                        content: |-
                          {%- set p = 'sensor.afvalwijzer_5685js_17_' -%}
                          {%- set ad = {'gft': 'GFT (organik)', 'restafval': 'Restafval (genel çöp)', 'pmd': 'PMD (plastik, metal, karton kutu)', 'papier': 'Kağıt', 'keukenafval': 'Mutfak atığı', 'luiers': 'Bez'} -%}
                          {%- set gun = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'] -%}
                          {%- set ay = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'] -%}
                          {%- macro tarih(s) -%}{%- set d = as_datetime(s) -%}{%- if d -%}{%- set d = d | as_local -%}{{ gun[d.weekday()] }} {{ d.day }} {{ ay[d.month - 1] }}{%- else -%}-{%- endif -%}{%- endmacro -%}
                          {%- macro kalan(n) -%}{%- if n is none -%}-{%- elif n | int == 0 -%}**bugün**{%- elif n | int == 1 -%}**yarın**{%- else -%}{{ n }} gün sonra{%- endif -%}{%- endmacro -%}
                          {%- macro adlar(s) -%}{%- set ns = namespace(l=[]) -%}{%- for t in s.split(',') -%}{%- set t = t | trim | lower -%}{%- set ns.l = ns.l + [ad.get(t, t)] -%}{%- endfor -%}{{ ns.l | join(', ') }}{%- endmacro -%}
                          {%- set bugun = states(p ~ 'today') -%}
                          {%- set yarin = states(p ~ 'tomorrow') -%}
                          {%- if bugun not in ['geen', 'unknown', 'unavailable'] %}
                          <ha-alert alert-type="warning">Bugün toplanıyor: <b>{{ adlar(bugun) }}</b></ha-alert>
                          {% endif -%}
                          {%- if yarin not in ['geen', 'unknown', 'unavailable'] %}
                          <ha-alert alert-type="info">Yarın toplanıyor: <b>{{ adlar(yarin) }}</b>. Kutuları bu akşam dışarı çıkar.</ha-alert>
                          {% endif %}
                          ## Sonraki toplama
                          **{{ tarih(states(p ~ 'next_date')) }}** · {{ kalan(states(p ~ 'next_in_days')) }}

                          {{ adlar(states(p ~ 'next_type')) }}

                          ## Tarihler
                          | | Çöp | Tarih | Kalan |
                          |---|---|---|---|
                          {%- set rows = namespace(l=[]) %}
                          {%- for k in ad %}{% set e = p ~ k %}{% if states(e) not in ['unknown', 'unavailable'] %}{% set rows.l = rows.l + [{'k': k, 'e': e, 'n': state_attr(e, 'days_until_collection_date')}] %}{% endif %}{% endfor %}
                          {%- for r in rows.l | sort(attribute='n') %}
                          | <ha-icon icon="{{ state_attr(r.e, 'icon') or 'mdi:trash-can' }}"></ha-icon> | {{ ad[r.k] }} | {{ tarih(states(r.e)) }} | {{ kalan(r.n) }} |
                          {%- endfor %}
                      - type: calendar
                        entities:
                          - calendar.afvalwijzer_5685js_17
                        initial_view: dayGridMonth
                hold_action:
                  action: more-info
              bahce_sulama:           # the back garden lawn: garden irrigation valve, tap toggle, hold more-info
                entity: valve.bahce_valve   # (like its icon on floorplan.yaml); the page waters the lawn while open
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              # cameras (Eufy): the card's camera mode; tap opens the live view (the card starts the
              # stream and stops it when the popup closes), hold more-info
              bahce_kamera:           # back garden security camera, back wall by the west corner
                entity: camera.backyard
                name: Bahçe
                motion: binary_sensor.backyard_motion_detected
                tap_action:           # RTSP is on for this camera: its stream starts over RTSP, P2P fails
                  action: camera
                  start: eufy_security.start_rtsp_livestream
                  stop: eufy_security.stop_rtsp_livestream
                hold_action:
                  action: more-info
              kapi_kamera:            # doorbell camera beside the front door (battery: P2P stream)
                entity: camera.doorbell
                name: Kapı
                motion: binary_sensor.doorbell_motion_detected
                tap_action:
                  action: camera
                  start: eufy_security.start_p2p_livestream
                  stop: eufy_security.stop_p2p_livestream
                hold_action:
                  action: more-info
              # lights
              garaj_light: &light
                entity: light.garaj_light
                tap_action:
                  action: toggle
                hold_action:
                  action: more-info
              salon_light:
                <<: *light
                entity: light.salon_light
                gain: 2                       # twice as bright as the render
              koridor0_light:
                <<: *light
                entity: light.koridor0_light
              mutfak_light:
                <<: *light
                entity: light.mutfak_light
              yemek_light:
                <<: *light
                entity: light.yemek_light
              car_light:
                <<: *light
                entity: light.car_light
              bahce_light:            # the garden's only lamp, on the back wall
                <<: *light
                entity: light.bahce_light
          - floor: kat1
            rooms:
              sercan: {sun: 1, covers: 2}
              bebek: {sun: 1, covers: 2}
              yatak: {sun: 1, covers: 2}                    # three blinds: their mean
              koridor1: {sun: 1, covers: 2}
              banyo: {sun: 1, covers: 2}                    # the window blind (banyo_cover)
              other: {sun: 3}
            entities:
              # covers (blinds cover the whole window: both panes and the top-hung sash)
              bebek_blind:
                entity: cover.bebek_cover
                tap_action:
                  action: perform-action
                  perform_action: script.cover_tap
                  data:
                    cover: cover.bebek_cover
                hold_action:
                  action: more-info
              sercan_blind:
                entity: cover.sercan_cover
                tap_action:
                  action: perform-action
                  perform_action: script.cover_tap
                  data:
                    cover: cover.sercan_cover
                hold_action:
                  action: more-info
              koridor1_blind:
                entity: cover.koridor1_cover
                tap_action:
                  action: perform-action
                  perform_action: script.cover_tap
                  data:
                    cover: cover.koridor1_cover
                hold_action:
                  action: more-info
              yatak_blind_pencere:            # north window
                entity: cover.yatak_cover_1
                <<: &yatak_blind              # all three command the group cover.yatak_cover; position from its own cover
                  tap_action:
                    action: perform-action
                    perform_action: script.cover_tap
                    data:
                      cover: cover.yatak_cover
                  hold_action:
                    action: more-info
                    entity: cover.yatak_cover
              yatak_blind_kapi:               # balcony door
                entity: cover.yatak_cover_3
                <<: *yatak_blind
              yatak_blind_dogu:               # east window (window contact: guarded)
                entity: cover.yatak_cover_window
                <<: *yatak_blind
              banyo_cover:                    # bathroom window blind (manual: follows its position, not selectable)
                entity: cover.banyo_cover
                selectable: false
              # radiators (climate: the room's thermostat)
              bebek_climate:
                <<: *climate
                entity: climate.bebek_thermostat
                name: Bebek
                humidity: sensor.bebek_sensor_humidity
              yatak_climate:
                <<: *climate
                entity: climate.yatak_thermostat
                name: Yatak
                humidity: sensor.yatak_sensor_humidity
              sercan_climate:
                <<: *climate
                entity: climate.sercan_thermostat
                name: Sercan
                humidity: sensor.sercan_sensor_humidity
              banyo_climate:                  # the towel radiator
                <<: *climate
                entity: climate.banyo_thermostat
                name: Banyo
                humidity: sensor.banyo_moisture_humidity
              # lights
              yatak_light:
                <<: *light
                entity: light.yatak_light
              bebek_light:
                <<: *light
                entity: light.bebek_light
              sercan_light:
                <<: *light
                entity: light.sercan_light
              banyo_light:
                <<: *light
                entity: light.banyo_light
              koridor1_light:
                <<: *light
                entity: light.koridor1_light
              balkon_light:           # the balcony lamp (Home Assistant still calls it kaan_light)
                <<: *light
                entity: light.kaan_light
          - floor: kat2
            rooms:
              misafir: {sun: 1, covers: 2}                  # the whole guest room, up to where its slope meets the walls
              melike: {sun: 0, covers: 3}                   # light only through the roof window: dark when its blind is closed
              cati_arasi: {sun: 0, covers: 0}               # behind the knee wall: only default
              misafir_cati_arasi: {sun: 0, covers: 0}       # under the roof behind the guest room's knee wall: only default
              other: {sun: 3}
            entities:
              # covers: the guest room's dormer curtain, the hall window's blind, melike's roof window blind
              misafir_cover:
                entity: cover.misafir_cover
                tap_action:
                  action: perform-action
                  perform_action: script.cover_tap
                  data:
                    cover: cover.misafir_cover
                hold_action:
                  action: more-info
              koridor2_cover:                 # attic hall window blind (manual: follows its position, not selectable)
                entity: cover.koridor2_cover
                selectable: false
              melike_cover:                   # melike's roof window blind (manual: follows its position, not selectable)
                entity: cover.melike_cover
                selectable: false
              # wardrobe sliding doors between melike and misafir (manual: follow their position, set on
              # the configs tab, not selectable)
              melike_dolap_kapi:
                entity: cover.melike_dolap_kapi
                selectable: false
              misafir_dolap_kapi:
                entity: cover.misafir_dolap_kapi
                selectable: false
              # radiators (climate: the room's thermostat)
              misafir_climate:
                <<: *climate
                entity: climate.misafir_thermostat
                name: Misafir
                humidity: sensor.misafir_sensor_humidity
              melike_climate:
                <<: *climate
                entity: climate.melike_thermostat
                name: Melike
                humidity: sensor.melike_sensor_humidity
              # lights
              misafir_light:                  # on the wall over the door
                <<: *light
                entity: light.misafir_light
              melike_light:
                <<: *light
                entity: light.melike_light
              koridor2_light:
                <<: *light
                entity: light.koridor2_light
          - floor: kat3
            rooms:
              tavan: {sun: 0, covers: 0}                    # no windows: only default
              other: {sun: 3}
            entities:
              # lights
              tavan_light:                    # on the attic's sloped ceiling
                <<: *light
                entity: light.tavan_light_2
  # Positions of the covers without a device (input numbers in packages/covers.yaml; their
  # initial value after a restart is set there)
  - title: configs
    path: configs
    cards:
      - type: entities
        title: Floorplan
        entities:
          - entity: input_boolean.floorplan_araba
            name: Araba
      - type: entities
        title: Cover positions
        entities:
          - entity: input_number.mutfak_cover_position
            name: Mutfak blind
          - entity: input_number.yemek_cover_position
            name: Yemek blind
          - entity: input_number.salon_kucuk_cover_position
            name: Salon kucuk perde
          - entity: input_number.banyo_cover_position
            name: Banyo blind
          - entity: input_number.koridor2_cover_position
            name: Koridor2 blind
          - entity: input_number.melike_cover_position
            name: Melike cati penceresi blind
          - entity: input_number.garaj_door_position
            name: Garaj kapisi
          - entity: input_number.melike_dolap_kapi_position
            name: Melike dolap kapisi
          - entity: input_number.misafir_dolap_kapi_position
            name: Misafir dolap kapisi
