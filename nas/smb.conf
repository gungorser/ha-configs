# Samba for the house NAS on the docker VM (192.168.0.222:445, LAN only: the router forwards no
# SMB). Service accounts only (ha-backup, ha-media; hook.sh -> /etc/nas/accounts): people have no
# NAS login since 2026-11-27. SMB passwords are Samba's own (set-password). Disks:
# /srv/nas/{backup,dokuman,foto} (proxmox/README.md).
[global]
  server role = standalone server
  workgroup = GUNGORS
  server string = Gungors NAS
  security = user
  passdb backend = tdbsam
  map to guest = never
  server min protocol = SMB3_00
  smb encrypt = desired
  disable netbios = yes
  smb ports = 445
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  log level = 1
  # macOS-friendly metadata, no ._ files on the disks
  vfs objects = catia fruit streams_xattr
  fruit:metadata = stream
  fruit:veto_appledouble = yes
  fruit:wipe_intentionally_left_blank_rfork = yes
  fruit:delete_empty_adfiles = yes

# Home Assistant's network storage for its backups: only its own folder, service user ha-backup.
[ha-backup]
  path = /srv/nas/backup/ha
  valid users = ha-backup
  read only = no
  force group = admin
  create mask = 0660
  directory mask = 2770

# Music for the TV's background music (Music Assistant): Home Assistant's network storage reads it
# with the service user ha-media. Songs are copied in on the docker VM.
[muzik]
  path = /srv/nas/foto/muzik
  valid users = ha-media
  read only = yes

# The 3D floor page and its renders (ha-floorplan's deploy on this VM writes the folder directly); Home Assistant's
# network storage `floorplan` reads it with the service user ha-media and copies it into
# /config/www (ha-configs floorplan/).
[floorplan]
  path = /srv/nas/foto/floorplan
  valid users = ha-media
  read only = yes
