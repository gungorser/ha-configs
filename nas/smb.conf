# Samba for the house NAS on the docker VM (192.168.0.222:445, LAN only: the router forwards no
# SMB). Users and groups match LLDAP (hook.sh -> /etc/nas/accounts); SMB passwords are Samba's own
# (set-smb-password). Disks: /srv/nas/{backup,dokuman,foto} (proxmox/README.md).
[global]
  server role = standalone server
  workgroup = GUNGORS
  server string = Gungors NAS
  security = user
  passdb backend = tdbsam
  map to guest = never
  server min protocol = SMB3_00
  smb encrypt = desired
  disable netbios = yes
  smb ports = 445
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  log level = 1
  # macOS-friendly metadata, no ._ files on the disks
  vfs objects = catia fruit streams_xattr
  fruit:metadata = stream
  fruit:veto_appledouble = yes
  fruit:wipe_intentionally_left_blank_rfork = yes
  fruit:delete_empty_adfiles = yes

# Backups (HA backups in ha/, later restic dumps): admins only.
[backup]
  path = /srv/nas/backup
  valid users = @admin
  read only = no
  force group = admin
  create mask = 0660
  directory mask = 2770

# Home Assistant's network storage: only its own folder, service user ha-backup (+ admins).
[ha-backup]
  path = /srv/nas/backup/ha
  valid users = ha-backup @admin
  read only = no
  force group = admin
  create mask = 0660
  directory mask = 2770

# General family documents (Paperless keeps its own files elsewhere on this disk, not shared).
[dokuman]
  path = /srv/nas/dokuman/genel
  valid users = @aile
  read only = no
  force group = aile
  create mask = 0660
  directory mask = 2770

# Scan inbox: files dropped here are consumed by Paperless (and then removed from here).
[tarama]
  path = /srv/nas/dokuman/paperless/consume
  valid users = @aile
  read only = no
  force user = paperless
  force group = paperless
  create mask = 0640
  directory mask = 0750

# Photos (Immich will use a folder in here later).
[foto]
  path = /srv/nas/foto
  valid users = @aile
  read only = no
  force group = aile
  create mask = 0660
  directory mask = 2770
