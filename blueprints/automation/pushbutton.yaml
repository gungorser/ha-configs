blueprint:
  name: pushbutton
  description: pushbutton automation
  domain: automation
  input:
    room:
      name: Room
      selector:
        area:
    device:
      name: Push Button Device
      description: Count of the buttons in the device
      selector:
        device:
          entity:
            domain: sensor
    button1:
      name: Button 1 function
      selector:
        select:
          options:
            - none
            - light
            - climate
            - cover
    button2:
      name: Button 2 function
      selector:
        select:
          options:
            - none
            - light
            - climate
            - cover
    button3:
      name: Button 3 function
      selector:
        select:
          options:
            - none
            - light
            - climate
            - cover

alias: Roomstate

trigger:
  - platform: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: "single"
  - platform: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: "double"
  - platform: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: "hold"
  - platform: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: "1_single"
  - platform: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: "1_double"
  - platform: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: "1_hold"
  - platform: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: "2_single"
  - platform: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: "2_double"
  - platform: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: "2_hold"
  - platform: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: "3_single"
  - platform: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: "3_double"
  - platform: device
    domain: mqtt
    device_id: !input device
    type: action
    subtype: "3_hold"

variables:
  room: !input room
  button1: !input button1
  button2: !input button2
  button3: !input button3
  transition: 1.0

  lights: >-
    {{  states.light 
      | selectattr('entity_id', 'in', area_entities(room)) 
      | map(attribute='entity_id') 
      | list }}
  climates: >-
    {{  states.climate 
      | selectattr('entity_id', 'in', area_entities(room)) 
      | map(attribute='entity_id') 
      | list }}
  covers: >-
    {{  states.cover 
      | selectattr('entity_id', 'in', area_entities(room)) 
      | map(attribute='entity_id') 
      | list }}
  functions: >-
    {{ {
      button1: {'single':'single', 'double':'double', 'hold': 'hold', '1_single':'single', '1_double': 'double', '1_hold': 'hold'},
      button2: {'2_single':'single', '2_double':'double', '2_hold': 'hold'},
      button3: {'3_single':'single', '3_double':'double', '3_hold': 'hold'}
    } }}
action:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ 'light' in functions and trigger.payload in functions['light'] }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ states.light
                        | selectattr('entity_id', 'in', lights)
                        | rejectattr('state', 'eq', 'off')
                        | list | count > 0
                      }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ functions['light'][trigger.payload] == 'hold' }}
                        sequence:
                          - action: light.turn_on
                            metadata: {}
                            data:
                              rgb_color: >
                                {% set red = state_attr(lights[0], 'rgb_color')[0] %}
                                {% set green = state_attr(lights[0], 'rgb_color')[1] %}
                                {% set blue = state_attr(lights[0], 'rgb_color')[2] %}
                                {% if green==0 and blue==0 %} 
                                {{ [red, red, red] }}
                                {% else %}
                                {{ [red, 0, 0] }} 
                                {% endif %}
                              transition: 1
                            target: "{{ {'entity_id': lights} }}"
                    default:
                      - action: light.turn_off
                        metadata: {}
                        data:
                          transition: "{{transition}}"
                        target: "{{ {'entity_id': lights} }}"
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ functions['light'][trigger.payload] == 'single' }}
                sequence:
                  - action: light.turn_on
                    metadata: {}
                    data:
                      brightness: 255
                      transition: 1
                    target: "{{ {'entity_id': lights} }}"
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ functions['light'][trigger.payload] == 'double' }}
                sequence:
                  - action: light.turn_on
                    metadata: {}
                    data:
                      transition: "{{transition}}"
                      brightness: 25
                    target: "{{ {'entity_id': lights} }}"
      - conditions:
          - condition: template
            value_template: >-
              {{ 'climate' in functions and trigger.payload in functions['climate'] }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ functions['climate'][trigger.payload] == 'single'}}
                sequence:
                  - action: climate.turn_on
                    metadata: {}
                    data: {}
                    target: "{{ {'entity_id': climates} }}"
                  - action: script.blink_light
                    data:
                      lights: "{{ lights }}"
                      color:
                        - 255
                        - 0
                        - 0
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ functions['climate'][trigger.payload] == 'double'}}
                sequence:
                  - action: climate.turn_off
                    metadata: {}
                    data: {}
                    target: "{{ {'entity_id': climates} }}"
                  - action: script.blink_light
                    data:
                      lights: "{{ lights }}"
                      color:
                        - 0
                        - 0
                        - 255
      - conditions:
          - condition: template
            value_template: >-
              {{ 'cover' in functions and trigger.payload in functions['cover'] }}
        sequence:
          - choose:
              # hold: every cover on the room's floor. Remote commands (normal cover
              # services), so each room's window guard still applies: the person
              # pressing is only responsible for their own window. If any cover is
              # not closed, a per-floor backup scene is taken and all are closed;
              # if all are already closed, the backup is restored.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ functions['cover'][trigger.payload] == 'hold' }}
                sequence:
                  - variables:
                      floor: >-
                        {%- set ns = namespace(f='') -%}
                        {%- for f in floors() if room in floor_areas(f) -%}{%- set ns.f = f -%}{%- endfor -%}
                        {{- ns.f -}}
                      floor_covers: >-
                        {{ (floor_areas(floor) if floor else [room])
                          | map('area_entities') | sum(start=[])
                          | select('match', 'cover\.')
                          | list }}
                      backup_id: "cover_backup_{{ floor if floor else room }}"
                  - if:
                      - condition: template
                        value_template: >-
                          {{ floor_covers | map('states') | reject('eq', 'closed') | list | count > 0 }}
                    then:
                      - action: scene.create
                        data:
                          scene_id: "{{ backup_id }}"
                          snapshot_entities: "{{ floor_covers }}"
                      - action: cover.close_cover
                        metadata: {}
                        data: {}
                        target: "{{ {'entity_id': floor_covers} }}"
                    else:
                      - if:
                          - condition: template
                            value_template: >-
                              {{ states('scene.' ~ backup_id) not in ['unknown', 'unavailable'] }}
                        then:
                          - action: scene.turn_on
                            target:
                              entity_id: "scene.{{ backup_id }}"
            # single / double: the room's covers, open / close. Physical press:
            # gungors covers with the `buttons` feature (physical_buttons attribute)
            # get the gungors_physical_cover event (allowed with the window open),
            # all other covers get the normal service. Groups are expanded so those
            # members get the event as well.
            default:
              - variables:
                  direction: >-
                    {{ 'open' if functions['cover'][trigger.payload] == 'single' else 'close' }}
                  guarded: >-
                    {{ expand(covers)
                      | selectattr('entity_id', 'in', integration_entities('gungors'))
                      | selectattr('attributes.physical_buttons', 'defined')
                      | map(attribute='entity_id') | list }}
                  plain: >-
                    {{ expand(covers)
                      | rejectattr('attributes.physical_buttons', 'defined')
                      | map(attribute='entity_id') | list }}
              - if:
                  - condition: template
                    value_template: "{{ guarded | count > 0 }}"
                then:
                  - event: gungors_physical_cover
                    event_data:
                      entity_id: "{{ guarded }}"
                      action: "{{ direction }}"
              - if:
                  - condition: template
                    value_template: "{{ plain | count > 0 }}"
                then:
                  - action: cover.{{ direction }}_cover
                    metadata: {}
                    data: {}
                    target: "{{ {'entity_id': plain} }}"
mode: single
